    let um = nf.match(/^[・･.。…‥\-ー─―_~〜〰]{2,}\s*(.*)$/);
    // 点線が読めず用法だけが残った行（「分2朝夕食後」「疼痛時頓用」「週1回起床時」）も用法とみなす
    if (!um && pending.length && !leadNumber(line)[0] && !/(錠|カプセル|mg|μg|%|散|顆粒|液|テープ|軟膏|クリーム|シロップ|配合)/.test(nf)
        && /^[・･.。…‥\s]*(分\s*\d|1日\s*\d+\s*回|週\s*\d|隔日|.{0,8}時\s*(頓用|頓服)|頓用|頓服|毎食|朝|昼|夕|就寝|眠前|寝る前|起床|食前|食後|食間)/.test(nf))
      um = [nf, nf.replace(/^[・･.。…‥\s]+/, '')];
    if (um) {
      const label = um[1].trim();
      if (!pending.length) doc.warnings.push(`対応する薬のない用法の行があります：${label}`);
      for (const d of pending) { d.usage = label; d.u = uFromStruct(structUsage(label)); }
      pending = []; last = null; continue;
    }
    // 一包化の注記（※①②④〜⑥一包化（朝3包、夕3包））
    if (((/^[※*＊]/.test(line) || /^米(?=[①-⑳\d(（])/.test(line)) && /包/.test(nf)) || (/一包化/.test(nf) && !/[錠カプセル]/.test(nf))) {
      const body = line.replace(/^[※*＊]\s*/, '');
      const i = body.search(/[一ー～〜\-]?包化/);
      const nums = parseNumberList(i >= 0 ? body.slice(0, i) : body);
      const counts = {};
      const cpart = normalize(i >= 0 ? body.slice(i) : '');
      for (const [l, k] of RPT_TIMES) { const m = cpart.match(new RegExp(l + '\\s*(\\d+)\\s*包')); if (m) counts[k] = +m[1]; }
      doc.packs.push({ nums, counts, raw: line });
      afterPacks = true;
      if (!nums.length) doc.warnings.push(`一包化の注記から番号を読み取れません：${line}`);
      continue;
    }
    // 薬の後ろの注記だけの行（配合剤の成分、採用なし・類似薬など）
    if (/^[(（]/.test(line) && last) { last.notes.push(nf.replace(/^[(（]|[)）]$/g, '')); continue; }
    // 薬の行（番号がない行は、薬らしい文字があるときだけ）
    let [no, rest] = leadNumber(line);
    if (!no && !/[ァ-ヴ]{2,}|錠|カプセル|散|顆粒|液|軟膏|\d\s*(mg|μg|g|%)/.test(nf)) continue;
    const expected = seq + 1;
    if (!no) { no = expected; fixedNo.push(`${circled(no)}（番号なし）`); }
    else if (no !== expected) { fixedNo.push(`${circled(expected)}（「${no}」と読めた）`); no = expected; }   // 丸数字の読み違い（⑮以降はOCRが苦手）→ 順番を優先
    seq = no;
    let t = normalize(rest).trim();
    const d = { no, name: '', dose: '', remain: null, remainText: '', none: false, ext: false, extOpen: 0, extFull: 0, notes: [], usage: '', u: null, clinic: ensureClinic().name };
    // 末尾の（…）を外しながら読む
    for (let guard = 0; guard < 6; guard++) {
      const m = t.match(/[(（]([^()（）]*)[)）]\s*$/);
      if (!m) break;
      const p = m[1].trim();
      t = t.slice(0, m.index).trim();
      let mm;
      if ((mm = p.match(/^残薬\s*[:：]?\s*(\d+(?:\.\d+)?)\s*(\D*)$/))) { d.remain = { amt: +mm[1], unit: mm[2].trim() }; d.remainText = p; }
      else if (/^持参なし/.test(p)) { d.none = true; d.remainText = p; }
      else if (/^(使いかけ\s*\d|\d+(?:\.\d+)?\s*(本|個|枚|瓶|袋|筒|キット|箱)(?:[、,]|$))/.test(p)) {
        d.ext = true; d.remainText = p;
        for (const x of p.split(/[、,]/)) { const q = x.match(/(使いかけ)?\s*(\d+(?:\.\d+)?)/); if (q) q[1] ? d.extOpen += +q[2] : d.extFull += +q[2]; }
      }
      else d.notes.unshift(p);
    }
    // 閉じかっこが読めなかった注記（「…1錠(採用なし 類似薬:…」）
    const open = t.match(/\s*[(（]\s*((?:院内|採用|残薬|持参|使いかけ|類似)[^()（）]*)$/);
    if (open) { d.notes.unshift(open[1].trim() + '（読み取り不完全）'); t = t.slice(0, open.index).trim(); }
    // 名前と量（このアプリの形式は「名前 1日量」）
    const RPT_DOSE = '((?:1日)?\\d+(?:\\.\\d+)?\\s*(?:錠|カプセル|C|包|g|mL|ml|枚|本|個|瓶|袋|吸入|滴|噴霧|単位|キット|筒|管))$';
    const dm = t.match(new RegExp('^(.*\\S)\\s+' + RPT_DOSE)) || t.match(new RegExp('^(.*[」)）])' + RPT_DOSE))
      || t.match(/^(.*[A-Za-zμ%])((?:1日)?\d+(?:\.\d+)?(?:錠|カプセル|本|枚|包|袋|個|瓶|キット|吸入))$/);   // 「…AP1錠」「…100mg14枚」「…0.1%2本」   // 「…「トーワ」1錠」のように空白がなくても
    if (dm) { d.name = dm[1].trim(); d.dose = dm[2].replace(/^1日/, '').replace(/\s/g, ''); } else d.name = t;
    if (!d.name) { doc.warnings.push(`${circled(no)}：薬品名を読み取れません（${line}）`); }
    ensureClinic().drugs.push(d); doc.drugs.push(d); pending.push(d); last = d;
  }
  if (pending.length) doc.warnings.push(`用法の行（・・・・・）がない薬があります：${pending.map(d => circled(d.no)).join('')}`);
  if (fixedNo.length) doc.warnings.unshift(`番号を上から順に数え直しました（名前と番号を確認してください）：${fixedNo.join('、')}`);
  // 一包化の番号の確認
  const byNo = new Map(doc.drugs.map(d => [d.no, d]));
  for (const p of doc.packs) {
    const miss = p.nums.filter(n => !byNo.has(n));
    if (miss.length) doc.warnings.push(`一包化の注記に、レポートにない番号があります：${miss.map(circled).join('')}`);
    for (const n of p.nums) { const d = byNo.get(n); if (d) d.pack = p; }
  }
  for (const d of doc.drugs) {
    if (!d.u) d.u = uFromStruct(structUsage(''));
    if (!d.ext && d.u.ext) d.ext = true;
  }
  return doc;
}

/* ================= 一覧の描画 ================= */
const toKata = s => s.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
function matches(d) {
  const q = ui.search.trim();
  if (!q) return true;
  const n = (d.name || '').toLowerCase();
  return n.includes(q.toLowerCase()) || n.includes(toKata(q).toLowerCase());
}

function rowHtml(d) {
  const t = total(d), sel = ui.selected.includes(d.id);
  const info = [d.dose, d.usage].filter(Boolean).join(' / ');
  const packs = state.packs.filter(p => p.drugIds.includes(d.id));
  return `<div class="row${sel ? ' sel' : ''}" data-act="${ui.packMode ? 'select' : 'open'}" data-id="${d.id}" role="button" tabindex="0">
    ${ui.packMode ? `<span class="check" aria-hidden="true">${sel ? '✓' : ''}</span>` : ''}
    <div class="info">
      <div class="dname">${esc(displayName(d))}</div>
      ${info ? `<div class="sub">${esc(info)}</div>` : ''}
      ${(packs.length || (Master.ready && !matched(d)) || (supplyOf(d)?.code > 1) || altTag(d)) ? `<div class="tags">${Master.ready && !matched(d) ? '<span class="tag warn">マスター未照合</span>' : ''}${supplyOf(d)?.code > 1 ? supplyTag(supplyOf(d)) : ''}${altTag(d)}${packs.map(p => `<span class="tag">${esc(p.name)} ${esc(packSummary(p) || '包数未入力')}</span>`).join('')}</div>` : ''}
    </div>
    <div class="qty" data-qty="${d.id}">${!t ? '<div class="none">—</div>'
      : isExt(d) ? `<div class="num" style="font-size:15px">${esc(extText(d))}</div><div class="bd">外用</div>`
      : `<div class="num">${qty(t)}<span class="u">${unit(d)}</span></div><div class="bd">${esc(breakdown(d))}</div>`}</div>
    ${ui.packMode ? '' : isExt(d)
      ? `<button class="quick" data-act="quick" data-id="${d.id}" aria-label="未開封を1${unit(d)}追加">+1${unit(d)}</button>`
      : `<button class="quick" data-act="quick" data-id="${d.id}" aria-label="1シート追加">+${d.sheetSize}</button>`}
  </div>`;
}

function recentHtml(exclude, act) {
  const ids = ui.recent.filter(id => id !== exclude && findDrug(id));
  if (!ids.length) return '';
  return `<div class="recent"><span class="lbl">最近</span>${ids.map(id => {
    const d = findDrug(id).drug;
    return `<button class="chip" data-act="${act}" data-id="${id}"><b>${esc(displayName(d))}</b><span>${qty(total(d))}${unit(d)}</span></button>`;
  }).join('')}</div>`;
}

function renderMain() {
  const hasDrugs = state.clinics.length > 0;
  $('#topTitle').textContent = ui.packMode ? '一包化の品目を選択' : (ui.label.trim() || '持参薬鑑別');
  $('#packBtn').textContent = ui.packMode ? 'キャンセル' : '一包化';
  $('#packBtn').disabled = !hasDrugs;
  $('#scanBtn').disabled = ui.packMode;
  $('#searchWrap').hidden = !hasDrugs;

  let html = '';
  if (!hasDrugs) {
    html = `<div class="empty">
      <h2>お薬手帳を読み取ってください</h2>
      <p>読み取った薬は医療機関ごとに並びます。数量はシート単位・バラ単位で何度でも足せます。</p>
      <div class="acts">
        <button class="btn primary" data-act="scan">お薬手帳を読み取る</button>
        <button class="btn" data-act="sample">サンプルで試す</button>
      </div>
      ${sessions.some(s => s.id !== ui.sid) ? `<button class="btn" data-act="sessions">保存した患者を再開（${sessions.filter(s => s.id !== ui.sid).length}件）</button>` : ''}
    </div>`;
  } else {
    if (state.packs.length && !ui.packMode && !ui.search.trim()) {
      html += `<section><h2 class="group-title">一包化</h2><div class="card">${state.packs.map(p => `
        <div class="pack-card" data-act="editPack" data-id="${p.id}" role="button" tabindex="0">
          <div class="ph"><span>${esc(p.name)}</span><b>計 ${packTotal(p)} 包</b></div>
          <div>${esc(packSummary(p) || '包数未入力')}</div>
          <div class="sub">${esc(p.drugIds.map(id => findDrug(id)).filter(Boolean).map(r => displayName(r.drug)).join('、'))}</div>
        </div>`).join('')}</div></section>`;
    }
    let shown = 0;
    for (const c of state.clinics) {
      const ds = c.drugs.filter(matches);
      if (!ds.length) continue;
      shown += ds.length;
      html += `<section class="clinic"><h2 data-act="clinicEdit" data-id="${c.id}" role="button" tabindex="0" style="cursor:pointer">${esc(c.name)} <span class="muted" style="font-weight:400;font-size:12px">編集</span></h2><div class="card">${ds.map(rowHtml).join('')}</div></section>`;
    }
    if (!shown) html += `<p class="muted">「${esc(ui.search)}」に一致する薬はありません。</p>`;
    if (!ui.packMode) html += `<div style="display:grid;gap:10px">
      <button class="btn" data-act="addPanel" style="min-height:52px">＋ 手帳にない薬を追加（GS1・名前検索）</button>
      <button class="btn primary" data-act="report" style="min-height:52px">鑑別レポートを作成</button></div>`;
  }
  $('#list').innerHTML = html;
  renderBottom();
}

function renderBottom() {
  const b = $('#bottom'), inner = $('#bottomInner');
  if (ui.packMode) {
    b.hidden = false;
    inner.innerHTML = `<button class="btn primary" data-act="makePack" ${ui.selected.length ? '' : 'disabled'} style="min-height:50px">選択した ${ui.selected.length} 品目で一包化を入力</button>`;
    return;
  }
  const rec = recentHtml(null, 'open');
  const last = ui.undo[ui.undo.length - 1];
  if (!rec && !last && !ui.note) { b.hidden = true; return; }
  b.hidden = false;
  inner.innerHTML = (ui.note ? `<p class="muted" role="status">${esc(ui.note)}</p>` : '') + rec
    + (last ? `<div class="undo"><span class="msg">${esc(last.msg)}</span><button class="btn" data-act="undo">取消</button></div>` : '');
}

function bump(id) {
  const q = document.querySelector(`[data-qty="${id}"]`);
  if (q) { q.classList.remove('bump'); void q.offsetWidth; q.classList.add('bump'); }
  const t = document.querySelector('#heatTotal');
  if (t) { t.classList.remove('bump'); void t.offsetWidth; t.classList.add('bump'); }
}

function refresh(bumpId) {
  renderMain();
  if (ui.panel) renderPanel();
  if (bumpId) bump(bumpId);
}

/* ================= パネル ================= */
function openPanel(p) {
  ui.panel = p;
  $('#panel').hidden = false;
  document.body.classList.add('locked');
  renderPanel(true);
}
function closePanel() {
  ui.panel = null;
  $('#panel').hidden = true;
  document.body.classList.remove('locked');
  renderMain();
}

function renderPanel(resetScroll) {
  const p = ui.panel; if (!p) return;
  const body = $('#pbody');
  const keep = resetScroll ? 0 : body.scrollTop;
  const r = PANELS[p.type]();
  $('#phead').innerHTML = `<div class="l">${r.left || ''}</div><h2>${esc(r.title)}</h2><div class="r">${r.right || ''}</div>`;
  $('#pbodyInner').innerHTML = r.body;
  $('#pfootInner').innerHTML = r.foot || '';
  $('#pfoot').hidden = !r.foot;
  body.scrollTop = keep;
}


// 短い名前：先頭のカタカナ等（10文字まで）＋最初の規格（例：メトホルミン 250mg）
function rptShort(d) {
  const n = (d.name || '').replace(/「[^」]*」/g, '').replace(/\s+/g, '');
  const head = (n.split(/錠|カプセル|散|顆粒|細粒|液|シロップ|テープ|軟膏|\d/)[0] || n.slice(0, 6)).slice(0, 10);
  const st = (n.match(/\d+(?:\.\d+)?(?:mg|μg|g|%)/) || [''])[0];
  return head + (st ? ' ' + st : '');
}
// 指示の入力フォーム（番号は薬品名つきのボタンで選ぶ。丸数字を読まなくてよい）
function instrForm(doc) {
  const ins = RPT.instr;
  if (!ins) return `<div class="block"><h3>指示<small>区切り（＊＊＊）より下</small></h3>
      <p class="muted">レポートに指示（＊＊＊＊の区切りより下）がありません。</p>
      <button class="btn primary" data-act="insNew">指示を入力する</button></div>`;
  const byNo = new Map(doc.drugs.map(d => [d.no, d]));
  const nm = rptShort;
  const chip = (act, d, on, extra = '') => `<button class="chip${on ? ' on' : ''}" data-act="${act}" data-n="${d.no}"${extra}>${circled(d.no)} ${esc(nm(d))}${d.u?.prn ? '<small>頓用</small>' : d.ext ? '<small>外用</small>' : ''}</button>`;
  const contSet = new Set(ins.contAll ? doc.drugs.map(d => d.no) : ins.cont);
  const stray = [...contSet].filter(n => !byNo.has(n));
  const covered = new Set(ins.preps.flatMap(p => p.nums));
  const notPrep = doc.drugs.filter(d => contSet.has(d.no) && !covered.has(d.no) && !d.u?.prn && !d.ext);
  const seg = (act, list, cur, extra = '') => list.map(([v, l]) => `<button class="seg${cur === v ? ' on' : ''}" data-act="${act}" data-v="${v}"${extra}>${l}</button>`).join('');
  return `<div class="block ins">
      <h3>指示<small>区切り（＊＊＊）より下・ボタンで修正できます</small></h3>
      <div class="field"><label for="insDate">指示日</label><input type="date" id="insDate" value="${mdToISO(ins.date)}"></div>
      <div class="field"><label>管理</label><div class="sizes">${seg('insManage', [['病棟管理', '病棟管理'], ['自己管理', '自己管理']], ins.manage)}</div></div>
      <div class="field"><label>継続する薬<small>${contSet.size}品目</small></label>
        <div class="chips">${doc.drugs.map(d => chip('insCont', d, contSet.has(d.no))).join('')}</div>
        <div class="inline" style="margin-top:6px"><button class="btn ghost" data-act="insContAll">すべて</button><button class="btn ghost" data-act="insContReg">定時の内服だけ</button><button class="btn ghost" data-act="insContNone">クリア</button></div>
        ${stray.length ? `<p class="warnline">レポートにない番号が指示にあります：${stray.map(circled).join('')}（読み違いなら上のボタンで選び直してください）</p>` : ''}
        ${ins.acts.length ? `<p class="muted">ほかの指示：${ins.acts.map(a => esc(instrNums(a.nums) + a.verb)).join('　')}</p>` : ''}
      </div>
      <div class="field"><label>用意済み<small>「〇月〇日（時点）まで」薬剤師が用意した分</small></label>
        ${ins.preps.map((p, i) => {
          const at = ` data-i="${i}"`;
          const bad = p.nums.filter(n => !byNo.has(n));
          return `<div class="prep">
            <div class="chips">${doc.drugs.filter(d => contSet.has(d.no) || p.nums.includes(d.no)).map(d => chip('insPrepNum', d, p.nums.includes(d.no), at)).join('')}</div>
            ${bad.length ? `<p class="warnline">レポートにない番号：${bad.map(circled).join('')}</p>` : ''}
            <div class="prep-when"><input type="date" class="insPrepDate"${at} value="${mdToISO(p.until)}"><span>まで</span></div>
            <div class="sizes">${seg('insPrepTime', [['', '終日'], ...INSTR_TIMES.map(t => [t, t])], p.time, at)}</div>
            <div class="inline" style="justify-content:space-between;margin-top:6px">
              <label class="pick" style="border:0;padding:0"><input type="checkbox" class="insPrepRemain"${at} ${p.remain ? 'checked' : ''} style="width:22px;height:22px"> <span>残薬あり（さらに7日分作れる）</span></label>
              <button class="btn ghost danger" data-act="insPrepDel"${at}>削除</button>
            </div>
          </div>`;
        }).join('')}
        <button class="btn" data-act="insPrepAdd">＋ 用意済みの行を追加${notPrep.length ? `（${notPrep.map(d => circled(d.no)).join('')}）` : ''}</button>
        ${notPrep.length ? `<p class="muted">継続する定時薬のうち、用意済みの記載がないもの：${notPrep.map(d => circled(d.no)).join('')}</p>` : ''}
      </div>
      <div class="field"><label for="insExtra">そのほかの指示（自由記載）</label><textarea id="insExtra" rows="2" style="width:100%;box-sizing:border-box">${esc(ins.extra.join('\n'))}</textarea></div>
      <div class="field"><label>指示の文（電子カルテに貼る用）</label><pre class="ins-out" id="insOut">${esc(instrText(ins))}</pre>
        <button class="btn primary" data-act="insCopy">コピー</button> <span class="muted" id="insCopyMsg"></span></div>
      <button class="btn primary" data-act="recipe" style="width:100%;min-height:52px;margin-top:6px">分包のレシピを作る</button>
    </div>`;
}

          <p class="muted">薬局の名前などが医療機関として入ってしまった場合は、正しい医療機関名に直すか、下の「まとめる」を使ってください。薬は消えません。</p>
        </div>
        <div class="block">
          <h3>この医療機関の薬（${c.drugs.length}品目）を別の医療機関にまとめる</h3>
          <div class="inline">${others.map(o => `<button class="btn" data-act="clinicMerge" data-to="${o.id}">「${esc(o.name)}」へ</button>`).join('') || '<span class="muted">ほかの医療機関はありません</span>'}
            ${c.name !== '医療機関不明' ? `<button class="btn" data-act="clinicMerge" data-to="__unknown">医療機関不明へ</button>` : ''}</div>
        </div>`
    };
  },

  formReview() {
    const rows = Form.items.filter(r => ['check', 'none', 'amb'].includes(r.st));
    const csv = Form.fixes.map(f => `${f.r.includes(',') ? '"' + f.r + '"' : f.r},${f.y},${f.n || ''}`).join('\n');
    return {
      title: '採用薬リストの確認',
      left: `<button class="btn ghost" data-act="masterPanel">‹ 戻る</button>`,
      body: `
        <p class="muted">棚表の表記とマスターの照合が怪しい行です。正しい薬をタップしてください。直した内容はこの端末ですぐ使われます。全端末に反映するには、下の「修正表」をGitHubの formulary-fixes.csv に追記してください（Claudeに送ってもらえれば反映します）。</p>
        ${Form.fixes.length ? `<div class="block"><h3>修正表（${Form.fixes.length}件）</h3>
          <textarea class="scanbox" id="fixCsv" style="min-height:120px;border-style:solid" readonly>${esc(csv)}</textarea>
          <button class="btn primary" data-act="copyFix">修正表をコピー</button><p class="muted" id="copyNote" role="status"></p></div>` : ''}
        ${rows.length ? rows.map((r, i) => `<div class="block">
          <h3>${esc(r.r)}<small>${{ check: '要確認', none: '該当なし', amb: '銘柄があいまい' }[r.st]}</small></h3>
          <div class="cands">${(r.c || []).map((c, k) => `<button class="cand" data-act="formFix" data-i="${Form.items.indexOf(r)}" data-k="${k}"><span class="cn">${esc(c[0])}</span><span class="cs">YJ ${esc(c[1])}・一致度 ${c[2]}</span></button>`).join('')}</div>
          <button class="btn" data-act="formExclude" data-i="${Form.items.indexOf(r)}">薬ではない行として除外</button>
        </div>`).join('') : '<p class="okline">要確認の行はありません。</p>'}`
    };
  },

  report() {

      return {
        title: p.saved.label || '保存したレポート',
        left: `<button class="btn ghost" data-act="sessions">‹ 戻る</button>`,
        body: `
          <p class="muted">${esc(fmtTime(p.saved.savedAt))} に保存したレポートです。</p>
          <textarea class="scanbox" id="reportText" style="min-height:60vh;border-style:solid" spellcheck="false">${esc(p.text)}</textarea>

        foot: `<button class="btn primary" data-act="reportCopy">コピー</button>`

      title: '鑑別レポート',

      body: `
        <p class="muted">医療機関ごと・用法ごと（分の少ない順、食前→食後）に並べています。ここで直接修正してから保存・コピーできます。</p>
        <textarea class="scanbox" id="reportText" style="min-height:55vh;border-style:solid" spellcheck="false">${esc(p.text)}</textarea>
        <p class="okline" id="copyNote" role="status">${esc(p.msg || '')}</p>
        ${ui.reports.length ? `<div class="block">
          <h3>この患者の保存済みレポート<small>タップで表示</small></h3>
          <div class="cands">${ui.reports.map((r, i) => `<button class="cand" data-act="reportLoad" data-i="${i}">
            <span class="cn">${esc(fmtTime(r.savedAt))}</span><span class="cs">${esc(r.text.split('\n').slice(1, 3).join(' '))}</span></button>`).join('')}</div>
        </div>` : ''}`,

  recipe() {
    const doc = RPT.doc, ins = RPT.instr, w = rcWard();
    if (!doc || !ins) return { title: '分包のレシピ', left: `<button class="btn ghost" data-act="rptPanel">戻る</button>`, body: '<p class="muted">先に持参薬レポートと指示を読み取ってください。</p>' };
    const R = rcRecipe();
    const seg = (act, list, cur, extra = '') => list.map(([v, l]) => `<button class="seg${String(cur) === String(v) ? ' on' : ''}" data-act="${act}" data-v="${v}"${extra}>${l}</button>`).join('');
    const nm = d => (d.name || '').replace(/「[^」]*」/g, '').replace(/\s+/g, '');
    const amt = (x, u) => `${x === 0.5 ? '½' : Number.isInteger(x) ? x : Number.isInteger(x - 0.5) ? (x - 0.5) + '½' : x}${rcUnit(u)}`;
    const cont = new Set(ins.contAll ? doc.drugs.map(d => d.no) : ins.cont);
    const noPrep = doc.drugs.filter(d => cont.has(d.no) && !ins.preps.some(p => p.nums.includes(d.no)) && !d.u?.prn && !d.ext && !d.u?.freq), needStart = noPrep.length;
    const endLabel = { prev: '定期日の前日の最後まで', '朝': '定期日の朝まで', '昼': '定期日の昼まで', '夕': '定期日の夕まで' };
    const card = b => {
      const empties = b.slots.flatMap(sl => sl.empty.map(iso => `${dMD(iso)} ${rcLabel(sl.t)}`));
      const remain = RCP.remain[b.key] ?? !!b.prep?.remain;
      return `<div class="block rc">
        <h3>●${esc(b.clinic)}${b.lax ? '<span class="tag warn" style="margin-left:6px">下剤・別包</span>' : ''}<small>${numberRange(b.nums)}</small></h3>
        <div class="rc-set">
          <div><small>開始日</small><b>${dMDW(b.s[0])}</b></div>
          <div><small>日数</small><b>${b.days}日分</b></div>
          <div><small>用法</small><b>${b.slots.map(sl => rcLabel(sl.t)).join('・')}</b></div>
        </div>
        ${empties.length ? `<p class="warnline">空けるマス：${empties.join('、')}</p>` : ''}
        ${b.slots.map(sl => `<div class="rc-slot">
            <div class="rc-sh"><b>${rcLabel(sl.t)}</b><span>${sl.cells.length}マス</span><span class="rc-pc">1マスに ${sl.pieces}錠</span></div>
            ${sl.items.map(x => `<div class="rc-it"><span class="rp-no">${circled(x.d.no)}</span><span>${esc(nm(x.d))}</span><b>${amt(x.a.amt, x.a.unit)}</b></div>`).join('')}
          </div>`).join('')}
        <table class="rc-grid"><caption>分包機のマス（上の段から、左から右へ）</caption>
          <tr><th></th>${b.dates.map(iso => `<th>${dMD(iso)}</th>`).join('')}</tr>
          ${b.slots.map(sl => `<tr><th>${rcLabel(sl.t)}</th>${b.dates.map(iso => sl.cells.includes(iso) ? `<td>${sl.pieces}</td>` : '<td class="e">空</td>').join('')}</tr>`).join('')}
        </table>
        <p class="muted rc-tot">使う量：${b.totals.map(t => `${circled(t.d.no)}${esc(rptShort(t.d))} ${amt(t.amt, t.unit)}${t.halves ? `（半錠${t.halves}個）` : ''}`).join('、')}</p>
        <label class="pick" style="border:0;padding:4px 0"><input type="checkbox" class="rcRemain" data-k="${esc(b.key)}" ${remain ? 'checked' : ''} style="width:22px;height:22px">
          <span>このあとも次の7日分を作れる（残薬あり）<br><small class="muted">次の7日分：${b.totals.map(t => `${circled(t.d.no)} ${amt(t.next7, t.unit)}`).join('、')}</small></span></label>
      </div>`;
    };
    const tname = { '起床時': 'wake', '朝': 'morning', '昼': 'noon', '夕': 'evening', '就寝前': 'bedtime' };
    const packCard = b => `<div class="block rc">
        <h3>●${esc(b.clinic)}<span class="tag pack" style="margin-left:6px">持参の一包化（包のまま）</span><small>${numberRange(b.nums)}</small></h3>
        <p class="muted">${dMDW(b.s[0])}から${b.until}${b.untilTime}まで。分包機では作らず、持参の包をそのまま使います。</p>
        ${b.slots.map(sl => { const have = b.drugs[0].pack?.counts?.[tname[sl.t]]; return `<div class="rc-sh"><b>${rcLabel(sl.t)}</b><span>${sl.cells.length}包使う</span>${have != null ? `<span class="${have < sl.cells.length ? 'rc-short' : 'muted'}">持参 ${have}包${have < sl.cells.length ? '（足りません）' : ''}</span>` : ''}</div>`; }).join('')}
      </div>`;
    return {
      title: '分包のレシピ',
      left: `<button class="btn ghost" data-act="rptPanel">戻る</button>`,
      body: `
        <div class="block ins">
          <h3>条件</h3>
          <div class="field"><label>病棟</label><div class="sizes">${RCP.wards.map((x, i) => `<button class="seg${i === RCP.ward ? ' on' : ''}" data-act="rcWard" data-v="${i}">${esc(x.name)}</button>`).join('')}<button class="seg" data-act="rcWardEdit">${RCP.editWard ? '閉じる' : '編集'}</button></div>
            <p class="muted">定期日：${WEEKDAYS[w.weekday]}曜日・${endLabel[w.end]}</p>
            ${RCP.editWard ? `<div class="prep">
              <div class="field"><label for="rcWardName">病棟名</label><input id="rcWardName" value="${esc(w.name)}"></div>
              <div class="field"><label>定期日</label><div class="sizes">${seg('rcWeekday', WEEKDAYS.map((x, i) => [i, x]), w.weekday)}</div></div>
              <div class="field"><label>持参薬で作る終わり</label><div class="sizes">${seg('rcEndMode', Object.entries(endLabel), w.end)}</div></div>
              <div class="inline"><button class="btn" data-act="rcWardAdd">＋ 病棟を追加</button>${RCP.wards.length > 1 ? '<button class="btn ghost danger" data-act="rcWardDel">この病棟を削除</button>' : ''}</div>
            </div>` : ''}</div>
          ${needStart ? `<div class="field"><label>用意済みの記載がない薬（${noPrep.map(d => circled(d.no)).join('')}）の開始</label>
            <div class="prep-when"><input type="date" id="rcStartDate" value="${RCP.start[0]}"><span>の</span></div>
            <div class="sizes">${seg('rcStartTime', RC_T.map((t, i) => [i, rcLabel(t)]), RCP.start[1])}<span class="muted" style="align-self:center">から</span></div></div>` : ''}
          <div class="field"><label for="rcDis">退院日（決まっていれば・その日の朝まで作る）</label>
            <div class="prep-when"><input type="date" id="rcDis" value="${RCP.discharge}">${RCP.discharge ? '<button class="btn ghost" data-act="rcDisClear">なし</button>' : ''}</div></div>
          <div class="field"><label>別包にする薬（下剤）<small>自動で選んでいます・タップで切替</small></label>
            <div class="chips">${doc.drugs.filter(d => cont.has(d.no) && !d.u?.prn && !d.ext && !d.u?.freq && !d.pack).map(d => {
              const on = RCP.lax[d.no] ?? LAXATIVE.test(d.name || '');
              return `<button class="chip${on ? ' on' : ''}" data-act="rcLax" data-n="${d.no}">${circled(d.no)} ${esc(rptShort(d))}</button>`;
            }).join('')}</div></div>
        </div>
        ${R.batches.length ? R.batches.map(card).join('') : '<div class="block"><p class="muted">分包機で作る薬はありません。</p></div>'}
        ${R.packs.map(packCard).join('')}
        ${R.skipped.length || R.unknown.length ? `<div class="block">
          ${R.unknown.length ? `<h3>確認が必要</h3>${R.unknown.map(x => `<p class="warnline">${circled(x.d.no)} ${esc(nm(x.d))}：${esc(x.why)}</p>`).join('')}<p class="muted">持参薬レポートの用法を「朝2錠・夕1錠」のように直して読み直すと計算できます。</p>` : ''}
          ${R.skipped.length ? `<h3>分包機の対象外</h3>${R.skipped.map(x => `<p class="muted">${circled(x.d.no)} ${esc(nm(x.d))}：${esc(x.why)}</p>`).join('')}` : ''}
        </div>` : ''}
        ${RCP.msg ? `<p class="okline" role="status">${esc(RCP.msg)}</p>` : ''}`,
      foot: `<button class="btn primary" data-act="rcApply" ${R.batches.length + R.packs.length ? '' : 'disabled'}>作った内容で指示の「用意済み」を更新</button>`
    };
  },
  rpt() {
    const doc = RPT.doc, cam = canScanGS1();
    const tag = (t, cls = '') => `<span class="tag${cls ? ' ' + cls : ''}">${esc(t)}</span>`;
    const row = d => `<div class="rp-row">
        <span class="rp-no">${circled(d.no)}</span>
        <div class="info">
          <div class="dname">${esc(d.name || '（名前なし）')}${d.dose ? ` <span class="rp-dose">${esc(d.dose)}</span>` : ''}</div>
          <div class="sub">${esc(d.usage || '用法なし')}</div>
          <div class="tags">${[
            d.pack ? tag('一包化', 'pack') : '',
            d.remain ? tag(`残薬 ${qty(d.remain.amt)}${d.remain.unit}`) : '',
            d.none ? tag('持参なし', 'warn') : '',
            d.ext && d.remainText ? tag(d.remainText) : '',
            d.u?.prn ? tag('頓用') : '',
            ...d.notes.map(n => tag(n, 'note'))].join('')}</div>
        </div></div>`;
    const tname = k => (TIMINGS.find(t => t[0] === k) || [, k])[1];
    const result = !doc ? '' : !doc.drugs.length ? `<div class="block"><p class="warnline">薬の行が見つかりません。【持参薬】から始まるレポートの文字か確認してください。</p></div>` : `
      <div class="block">
        <h3>読み取り結果<small>${doc.clinics.length}医療機関・${doc.drugs.length}品目${doc.packs.length ? `・一包化${doc.packs.length}件` : ''}</small></h3>
        ${doc.warnings.length ? `<div class="rp-warn">${doc.warnings.map(w => `<p class="warnline">${esc(w)}</p>`).join('')}</div>` : '<p class="okline">番号・用法・一包化の注記に食い違いはありません</p>'}
      </div>
      ${doc.clinics.map(c => `<div class="block"><h3>●${esc(c.name)}</h3>${c.drugs.map(row).join('')}</div>`).join('')}
      ${doc.packs.length ? `<div class="block"><h3>一包化</h3>${doc.packs.map((p, i) => `<div class="rp-pack">
          <div class="dname">${esc(p.nums.length ? numberRange(p.nums) : '番号不明')}</div>
          <div class="sub">${Object.keys(p.counts).length ? Object.entries(p.counts).map(([k, v]) => `${tname(k)}${v}包`).join('、') : '包数の記載なし'}</div>
        </div>`).join('')}</div>` : ''}`;
    return {
      title: '持参薬レポートを読む',
      left: `<button class="btn ghost" data-act="close">閉じる</button>`,
      body: `
        <div class="block">
          <h3>レポートを取り込む<small>服用開始・一包化の準備に使います</small></h3>
          <div class="ocr-btns">
            ${cam ? `<button class="btn primary" data-act="rptCam">カメラで撮る（無音）</button>` : ''}
            <label class="btn filebtn${cam ? '' : ' primary'}" for="rptFile">画像を選ぶ</label>
            <input type="file" id="rptFile" accept="image/*" multiple hidden>
          </div>
          <div class="ocr-status" id="ocrStatus" ${OCR.status ? '' : 'hidden'}>
            <div class="ocr-bar"><span id="ocrBar" style="width:${Math.round((OCR.progress || 0) * 100)}%"></span></div>
            <p class="muted" id="ocrMsg">${esc(OCR.status || '')}</p>
          </div>
          <p class="muted">電子カルテなどに表示された持参薬レポートを撮影するか、スクリーンショットを選んでください。長いレポートは何枚かに分けて取り込めます（続けて追加されます）。文字をコピーできる場合は、下の枠に貼り付けるのが一番確実です。${llmReady() ? 'LLMサーバが有効なので、書き起こしにLLMも使います。' : ''}</p>
        </div>
        <textarea class="scanbox" id="rptText" placeholder="【持参薬】から始まるレポートの文字（読み取り結果・貼り付け）" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">${esc(RPT.text)}</textarea>
        <div class="inline" style="margin:8px 0 14px">
          <button class="btn primary" data-act="rptParse">読み直す</button>
          <button class="btn" data-act="rptClear">消去</button>
          <button class="btn ghost" data-act="rptFromCurrent">今の患者のレポートを入れる</button>
        </div>
        ${result}
        ${doc && doc.drugs.length ? instrForm(doc) : ''}`
    };
  },

  ocr() {
    const e = ocrEngine(), p = ui.panel;
    const opt = (v, t, d) => `<button data-act="ocrSet" data-v="${v}" aria-pressed="${e === v}" style="display:block;width:100%;text-align:left;font:inherit;color:inherit;margin:0 0 8px;padding:12px 14px;border-radius:12px;cursor:pointer;${e === v ? 'border:2px solid #0e6a5a;background:#eef6f3' : 'border:1px solid #c9d2cf;background:#fff'}">
      <div style="font-weight:600;margin-bottom:2px">${e === v ? '◉' : '○'} ${t}</div><div class="muted" style="margin:0">${d}</div></button>`;
    return {
      title: '端末内の読み取り（OCR）',
      left: `<button class="btn ghost" data-act="close">閉じる</button>`,
      body: `
        <div class="block">
          <h3>読み取りエンジン</h3>
          ${opt('ndl', 'NDLOCR-Lite（おすすめ）', '日本語の印刷物に強いOCR。初回だけモデル（約80MB）をダウンロードし、以後はオフラインで動きます。1ページ10秒前後。')}
          ${opt('tess', 'Tesseract', '軽くて準備が早いが、精度は低め（半角カナ・影に弱い）。')}
        </div>
        ${e === 'ndl' ? `<div class="block">
          <h3>モデルのダウンロード</h3>
          <p class="muted" id="ocrDlMsg" role="status">${esc(p.msg || (p.cached ? 'この端末に保存済みです。' : p.cached === false ? 'まだダウンロードしていません。Wi-Fiにつないだ状態でダウンロードしておくと、初回の読み取りが早くなります。' : '確認中…'))}</p>
          <button class="btn primary" data-act="ocrDownload">${p.cached ? 'もう一度準備する' : '今ダウンロードする（約80MB）'}</button>
        </div>` : ''}
        <div class="block">
          <h3>使用しているOCR</h3>
          <p class="muted">NDLOCR-Lite：国立国会図書館（NDLラボ）が公開しているOCRのモデル（CC BY 4.0）を、この端末のブラウザ内で動かしています（<a href="https://github.com/ndl-lab/ndlocr-lite" target="_blank" rel="noopener">github.com/ndl-lab/ndlocr-lite</a>）。重みを16bitで保存し直して容量を半分にしたほかは、元のモデルのままです。実行には ONNX Runtime Web（MIT）を使っています。</p>
          <p class="muted">Tesseract.js（Apache 2.0）。写真はどちらのエンジンでも端末の外には送られません。</p>
        </div>`
    };
  },

  llm() {
    const c = llmCfg(), p = ui.panel;
    return {
      title: 'LLMサーバ',
      left: `<button class="btn ghost" data-act="close">閉じる</button>`,
      body: `
        <div class="block">
          <h3>お薬手帳の読み取りにLLMを使う</h3>
          <label class="pick" style="border:0"><input type="checkbox" id="llmOn" ${c.on ? 'checked' : ''} style="width:22px;height:22px"> <span>有効にする</span></label>
          <p class="muted">有効にすると、手帳の写真をこの端末の読み取りと並行して自前のLLMサーバに送ります（Tailscale経由・HTTPS）。つながらないときは、端末内の読み取りだけで動きます。読んだ薬品名は必ずマスターと照合してから使います。</p>
          <p class="warnline">写真には患者情報が含まれます。送り先は下のサーバだけです。</p>
        </div>
        <div class="block">
          <div class="field"><label for="llmUrl">サーバのURL</label><input id="llmUrl" data-llm="url" value="${esc(c.url)}" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
          <div class="field"><label for="llmModel">モデル名</label><input id="llmModel" data-llm="model" value="${esc(c.model)}" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
          <div class="field"><label for="llmKey">APIキー（この端末にだけ保存されます）</label><input id="llmKey" data-llm="key" type="password" value="${esc(c.key)}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
          <p class="muted" id="llmKeyInfo">${esc(keyInfo(c.key))}</p>
          <button class="btn primary" data-act="llmTest">接続を確認</button>

function rvCands(d) {
  const base = d.cands?.length ? d.cands : searchMaster(d.rawName || d.name, 6, true);
  if (!d.showAll || !base[0]?.y) return base;
  const y9 = base[0].y.slice(0, 9), seen = new Set(base.map(c => c.n));
  const more = Master.items.filter(it => it.y && it.y.slice(0, 9) === y9 && !seen.has(it.n)).map(it => ({ n: it.n, y: it.y, sim: 0 }));
  return [...base, ...more];
}

  if (e.empty) return d.usage ? `<div class="rv-badge ng">用法を読み取れません（数量入力画面の用法フォームで入れてください）</div>` : '';
  const parts = [d.dose ? `1日量 ${d.dose}` : '', u.perDose ? `1回 ${u.perDose}` : '', u.days].filter(Boolean).join('・');
  return `<div class="rv-badge ${e.flags.length ? 'ng' : 'ok'}">レポート：・・・・・${esc(d.usageLabel || e.label)}${parts ? `（${esc(parts)}）` : ''}</div>`
    + e.flags.map(f => `<div class="rv-badge ng">⚠ ${esc(f)}</div>`).join('');
}

function openHeat(id) { touch(id); save(); openPanel({ type: 'heat', id }); }

function makeReview(text) {
  // 写真から読んだままなら座標を使って読み解く。手で直した・貼り付けた場合は文字だけで読む
  let clinics = [];
  if (ui.scanPages?.length && ui.scanPagesText === ui.scanText) {
    for (const pg of ui.scanPages) {
      const part = pg.llm ? llmToClinics(pg.llm) : [];
      for (const c of (part.length ? part : parseLayout([pg]))) {
        const t = clinics.find(x => x.name === c.name && c.name !== '医療機関不明');
        if (t) t.drugs.push(...c.drugs); else clinics.push(c);
      }
    }
  }
  if (!clinics.length) clinics = parse(text);
  for (const c of clinics) for (const d of c.drugs) { autoMatch(d); normalizeDoses(d); }
  return { clinics, raw: text };
}

const OUTSIDE = '手帳外（持参のみ）';
function clinicFor(name) {
  let c = state.clinics.find(x => x.name === name);
  if (!c) { c = { id: uid(), name, drugs: [] }; state.clinics.push(c); }
  return c;
}
// すでに一覧にある薬なら、その薬を開く（「あ、もう1シートあった」に対応）
function addDrugFromMaster(it, sim, gtin) {
  for (const c of state.clinics) {
    const d = c.drugs.find(x => (it.y && x.yj === it.y && x.name === it.n) || x.name === it.n);
    if (d) {
      if (gtin && !d.gs1) d.gs1 = gtin;
      const sz = gtin && sheetFromGS1(gtin); if (sz) d.sheetSize = sz;
      ui.note = `${displayName(d)} は一覧にあります（${c.name}）${sz ? `。1シート${sz}に設定` : ''}`; save(); openHeat(d.id); return;
    }
  }
  const d = newDrug(it.n);
  d.yj = it.y || ''; d.matchSim = sim; if (gtin) d.gs1 = gtin;
  const sz = gtin && sheetFromGS1(gtin); if (sz) d.sheetSize = sz;
  clinicFor(ui.panel.clinic || OUTSIDE).drugs.push(d);
  save();
  openHeat(d.id);
}

function flashNote(r) {
  ui.note = r.skipped ? `${r.added}品目を追加（重複${r.skipped}品目はスキップ）` : `${r.added}品目を追加しました`;
  renderBottom();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el); }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-act]')) {
    e.preventDefault(); e.target.click();
  }
  if (e.key === 'Enter' && e.target.id === 'looseInput') { e.preventDefault(); actions.looseAdd(); }
  if (e.key === 'Enter' && e.target.id === 'gs1In') { e.preventDefault(); (ui.panel?.type === 'add' ? actions.addGs1 : actions.gs1Apply)(); }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'search') { ui.search = t.value; renderMain(); return; }
  if (t.id === 'scanText') { ui.scanText = t.value; save(); return; }
  if (t.id === 'rptText') { RPT.text = t.value; rptSave(); return; }
  if (t.id === 'reportText') { ui.panel.text = t.value; return; }
  if (t.id === 'sLabel') { ui.label = t.value; save(); renderMain(); return; }
  if (t.dataset.amt && ui.panel?.type === 'heat') {
    const r = findDrug(ui.panel.id);
    if (r) {
      if (t.dataset.amt === 'dose') { r.drug.dose = withUnit(t.value, r.drug); delete r.drug.doseCalc; }
      else r.drug.u = { ...getU(r.drug), perDose: withUnit(t.value, r.drug, perDoseUnit) };
      save(); refreshUsageLabel(r.drug); renderMain();
    }
    return;
  }
  if (t.dataset.u && ui.panel?.type === 'heat') {
    const r = findDrug(ui.panel.id);
    if (r) { r.drug.u = { ...getU(r.drug), [t.dataset.u]: t.value.trim() }; save(); refreshUsageLabel(r.drug); renderMain(); }
    return;
  }
  if (t.dataset.llm) {
    const c = llmCfg();
    let v = t.value.trim();
    if (t.dataset.llm === 'key') {
      // 貼り付け時に紛れ込む空白・改行・ゼロ幅文字や「API key:」のような見出しを取り除く
      v = v.replace(/[\s\u200B-\u200D\uFEFF\u00A0]/g, '').replace(/^(?:api[_-]?key|key|apikey)[:：=]/i, '');
    }
    c[t.dataset.llm] = v; setLlmCfg(c);
    if (t.dataset.llm === 'key') { const k = $('#llmKeyInfo'); if (k) k.textContent = keyInfo(v); }
    return;
  }
  if (t.id === 'mSearch' || t.id === 'addSearch') {
    const q = t.value.trim();
    ui.panel.cands = q ? searchMaster(q, 8, true) : null;
    const box = $('#mResults');
    if (box) box.innerHTML = ui.panel.cands ? candList(ui.panel.cands, t.id === 'addSearch' ? 'addPick' : 'applyCand') : '';
    return;
  }
  if (t.dataset.rv) {
    const [ci, di, f] = t.dataset.rv.split('|');
    const c = ui.panel.review.clinics[+ci];
    if (+di < 0) c.name = t.value;
    else { c.drugs[+di][f] = t.value; if (f === 'name') { c.drugs[+di].yj = ''; c.drugs[+di].matchSim = 0; } }
    return;
  }
  if (t.dataset.f && ui.panel?.type === 'heat') {
    const r = findDrug(ui.panel.id);
    if (r) {
      r.drug[t.dataset.f] = t.value;
      if (t.dataset.f === 'name') { r.drug.yj = ''; r.drug.matchSim = 0; r.drug.rawName = t.value; }
      if (['dose', 'usageLabel', 'usage'].includes(t.dataset.f)) refreshUsageLabel(r.drug);
      save(); renderMain();
    }
    return;
  }
  if (t.dataset.pk) { ui.panel.pack.name = t.value; return; }
  if (t.dataset.tm) {
    const n = parseInt(t.value.replace(/\D/g, ''), 10);
    ui.panel.pack.counts[t.dataset.tm] = isFinite(n) ? n : 0;
    const tot = $('#pkTotal'); if (tot) tot.textContent = `合計 ${packTotal(ui.panel.pack)} 包`;
  }
});
document.addEventListener('change', async e => {
  if (e.target.dataset.rvmove && ui.panel?.type === 'review') {
    const [ci, di] = e.target.dataset.rvmove.split('|').map(Number), to = +e.target.value, cs = ui.panel.review.clinics;
    if (to !== ci) { const [d] = cs[ci].drugs.splice(di, 1); cs[to].drugs.push(d); if (!cs[ci].drugs.length) cs.splice(ci, 1); renderPanel(); }
    return;
  }
  if (e.target.id === 'llmOn') { const c = llmCfg(); c.on = e.target.checked; setLlmCfg(c); return; }
  if (e.target.id === 'rcStartDate' && e.target.value) { RCP.start = [e.target.value, RCP.start[1]]; rcpSave(); renderPanel(); return; }
  if (e.target.id === 'rcDis') { RCP.discharge = e.target.value; renderPanel(); return; }
  if (e.target.id === 'rcWardName') { rcWard().name = e.target.value.trim() || '病棟'; rcpSave(); renderPanel(); return; }
  if (e.target.classList?.contains('rcRemain')) { RCP.remain[e.target.dataset.k] = e.target.checked; return; }
  if (e.target.id === 'insDate' && RPT.instr) { RPT.instr.date = isoToMD(e.target.value); rptApplyInstr(); return; }
  if (e.target.classList?.contains('insPrepDate') && RPT.instr) { RPT.instr.preps[+e.target.dataset.i].until = isoToMD(e.target.value); rptApplyInstr(); return; }
  if (e.target.classList?.contains('insPrepRemain') && RPT.instr) { RPT.instr.preps[+e.target.dataset.i].remain = e.target.checked; rptApplyInstr(); return; }
  if (e.target.id === 'insExtra' && RPT.instr) { RPT.instr.extra = e.target.value.split('\n').map(x => x.trim()).filter(Boolean); rptApplyInstr(); return; }
  if (e.target.id === 'rptFile' && e.target.files.length) {
    const files = [...e.target.files];
    e.target.value = '';
    for (const f of files) rptImage(f);
    return;
  }
  if (e.target.id === 'ocrFile' && e.target.files.length) {
    const files = [...e.target.files];
    e.target.value = '';
    for (const f of files) ocrImage(f);
    return;
  }
  if (e.target.dataset.f && ui.panel?.type === 'heat') renderPanel();
  if (e.target.id === 'masterFile' && e.target.files.length) {
    const files = [...e.target.files];
    const msg = t => { ui.panel.msg = t; const m = $('#masterMsg'); if (m) m.textContent = t; };
    try {
      const r = await importMasterFiles(files, msg);
      const n = rematchAll();
      ui.panel.msg = `取り込み完了：${r.rowsDone.toLocaleString()}行を読み、${Master.items.length.toLocaleString()}品目になりました。`
        + (r.linked ? `GS1対応表 ${r.linked.toLocaleString()}行をHOTコードで結びつけました。` : '')
        + (r.unlinked ? `${r.unlinked.toLocaleString()}行は対応する薬品名が見つからず保留です（薬品名のファイルも取り込んでください）。` : '')
        + (n ? `一覧の${n}品目を照合しました。` : '')
        + (r.stored ? '' : '※このブラウザに保存できなかったため、ページを閉じると消えます。');
    } catch (err) {
      ui.panel.msg = '取り込めませんでした：' + (err?.message || err);
    }
    refresh();
  }
});

// 画面を点けたままにする（対応ブラウザのみ）
async function keepAwake() {
  try { if ('wakeLock' in navigator && document.visibilityState === 'visible') await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', keepAwake);
document.addEventListener('click', keepAwake, { once: true });

load();
renderMain();
idbGet('sessions').then(arr => {
  sessions = Array.isArray(arr) ? arr : [];
  sessionsLoaded = true;
  archiveCurrent();
  renderMain(); if (ui.panel) renderPanel();
});
// アプリを閉じる・切り替える直前にも保存
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') archiveCurrent(); });
window.addEventListener('pagehide', () => archiveCurrent());
idbGet('master').then(m => {
  if (m && Array.isArray(m.items) && m.items.length) {
    Master.items = m.items; Master.meta = m.meta; buildIndex();
    renderMain(); if (ui.panel) renderPanel();
  }
  return idbGet('supply');
}).then(s => {
  if (s && s.items) { Supply.items = s.items; Supply.meta = s.meta; if (s.codes) Supply.codes = s.codes; }
  return idbGet('formulary');
}).then(f => {
  if (f && f.items) { Form.items = f.items; Form.meta = f.meta; applyLocalFixes(); buildFormIndex(); }
  renderMain(); if (ui.panel) renderPanel();
  pullMaster(false);   // サーバーに新しいマスター・供給状況があれば取得（GitHub Pages版のみ）
});
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
