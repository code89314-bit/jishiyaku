<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>持参薬鑑別サポート</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: 薬袋の仕分けトレイ — 医療機関ごとの区画に薬が並び、数量は右端の帳簿欄。入力は全画面のパネル。 */
:root {
  --bg: #eef2ef;
  --surface: #ffffff;
  --ink: #18221e;
  --muted: #5a6962;
  --line: #d5ddd8;
  --accent: #0e6a5a;
  --accent-ink: #ffffff;
  --accent-soft: #d9ede7;
  --warn: #b1432a;
  --warn-soft: #f7e1da;
  --pack: #94590a;
  --pack-soft: #f5e6cf;
  --font-body: "BIZ UDPGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
  --font-display: "Zen Kaku Gothic New", "Hiragino Sans", system-ui, sans-serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111614; --surface: #1a211e; --ink: #e5ece8; --muted: #98a69f; --line: #2b3531;
    --accent: #4dbda4; --accent-ink: #052019; --accent-soft: #163630;
    --warn: #ee8b6d; --warn-soft: #3a211a; --pack: #e2a650; --pack-soft: #3a2c16;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111614; --surface: #1a211e; --ink: #e5ece8; --muted: #98a69f; --line: #2b3531;
  --accent: #4dbda4; --accent-ink: #052019; --accent-soft: #163630;
  --warn: #ee8b6d; --warn-soft: #3a211a; --pack: #e2a650; --pack-soft: #3a2c16;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
body.locked { overflow: hidden; }
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
button, input, textarea { font: inherit; color: inherit; }
button { touch-action: manipulation; -webkit-user-select: none; user-select: none; cursor: pointer; }
input, textarea { font-size: 16px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .tab { font-variant-numeric: tabular-nums; }

/* buttons */
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
  min-height: 44px; padding: 0 14px; font-weight: 700;
}
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); padding: 0 6px; }
.btn:disabled { opacity: .4; }

/* top */
.top-wrap {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.top, .searchwrap, main, .bottom-inner {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top { display: flex; align-items: center; gap: 8px; padding-block: 8px; }
.top h1 {
  flex: 1; margin: 0; font-family: var(--font-display); font-size: 18px; font-weight: 700;
  text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.top-actions { display: flex; gap: 6px; }
.searchwrap { padding-block: 0 10px; }
.searchwrap input {
  width: 100%; height: 40px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); padding: 0 12px;
}

/* list */
main { padding-block: 12px 220px; display: flex; flex-direction: column; gap: 18px; }
.clinic h2, .group-title {
  margin: 0 0 6px; font-family: var(--font-display); font-size: 14px; font-weight: 700;
  color: var(--muted); letter-spacing: .04em; display: flex; align-items: center; gap: 6px;
}
.clinic h2::before {
  content: ""; width: 10px; height: 10px; border-radius: 2px; background: var(--accent);
  flex: none;
}
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.row {
  display: flex; align-items: center; gap: 10px; padding: 12px; min-height: 64px;
  border-top: 1px solid var(--line); cursor: pointer;
}
.row:first-child { border-top: 0; }
.row:active { background: var(--accent-soft); }
.row.sel { background: var(--accent-soft); }
.check {
  flex: none; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--muted);
  display: grid; place-items: center; font-weight: 700; color: var(--accent-ink);
}
.row.sel .check { background: var(--accent); border-color: var(--accent); }
.info { flex: 1; min-width: 0; }
.dname { font-weight: 700; overflow-wrap: anywhere; }
.sub { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.tag { font-size: 11.5px; padding: 1px 8px; border-radius: 99px; background: var(--pack-soft); color: var(--pack); font-weight: 700; }
.qty { text-align: right; flex: none; min-width: 56px; }
.qty .num { font-family: var(--font-display); font-size: 22px; font-weight: 700; line-height: 1.1; }
.qty .u { font-size: 12px; margin-left: 1px; color: var(--muted); }
.qty .bd { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.qty .none { color: var(--line); font-size: 20px; }
.qty.bump .num { animation: bump .35s ease; color: var(--accent); }
@keyframes bump { 0% { transform: scale(1.25); } 100% { transform: scale(1); } }
.quick {
  flex: none; min-width: 52px; height: 40px; border-radius: 99px; border: 1px solid var(--accent);
  background: var(--accent-soft); color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums;
}
.quick:active { background: var(--accent); color: var(--accent-ink); }
.pack-card { padding: 12px; display: grid; gap: 2px; border-top: 1px solid var(--line); cursor: pointer; }
.pack-card:first-child { border-top: 0; }
.pack-card .ph { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; }
.pack-card .ph b { color: var(--pack); font-variant-numeric: tabular-nums; }

.empty { text-align: center; padding: 48px 8px; display: grid; gap: 14px; justify-items: center; }
.empty h2 { font-family: var(--font-display); margin: 0; font-size: 20px; }
.empty p { margin: 0; color: var(--muted); max-width: 32em; }
.empty .acts { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

/* bottom bar */
.bottom {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.bottom-inner { padding-block: 8px; display: grid; gap: 8px; }
.recent { display: flex; gap: 8px; overflow-x: auto; align-items: center; scrollbar-width: none; }
.recent::-webkit-scrollbar { display: none; }
.recent .lbl { font-size: 11px; color: var(--muted); flex: none; letter-spacing: .06em; }
.chip {
  flex: none; max-width: 160px; text-align: left; border: 1px solid var(--line); background: var(--bg);
  border-radius: 10px; padding: 5px 10px; line-height: 1.25;
}
.chip b { display: block; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip span { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.undo { display: flex; align-items: center; gap: 10px; }
.undo .msg { flex: 1; min-width: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.undo .msg::before { content: "＋ "; color: var(--accent); font-weight: 700; }

/* panel */
.panel {
  position: fixed; inset: 0; z-index: 20; background: var(--bg);
  display: flex; flex-direction: column;
}
.phead {
  padding-top: env(safe-area-inset-top, 0px); background: var(--bg); border-bottom: 1px solid var(--line);
}
.phead-inner, .pbody-inner, .pfoot-inner {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.phead-inner { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding-block: 6px; gap: 8px; }
.phead-inner h2 { margin: 0; font-family: var(--font-display); font-size: 17px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60vw; }
.phead-inner .r { justify-self: end; }
.phead-inner .l { justify-self: start; }
.pbody { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.pbody-inner { padding-block: 14px 32px; display: grid; gap: 16px; }
.pfoot { border-top: 1px solid var(--line); background: var(--surface); padding-bottom: env(safe-area-inset-bottom, 0px); }
.pfoot-inner { padding-block: 10px; display: flex; gap: 10px; align-items: center; }
.pfoot-inner .btn { flex: 1; min-height: 50px; }
.pfoot-inner .pos { flex: none; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.block { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; }
.block h3 { margin: 0; font-size: 13px; color: var(--muted); font-weight: 700; letter-spacing: .04em; }
.block h3 small { font-weight: 400; margin-left: 6px; }

.hero { display: grid; gap: 2px; }
.hero .cl { font-size: 12px; color: var(--muted); }
.hero .nm { font-family: var(--font-display); font-size: 20px; font-weight: 700; overflow-wrap: anywhere; }
.hero .inf { font-size: 13px; color: var(--muted); }
.total { display: flex; align-items: baseline; gap: 6px; margin-top: 6px; }
.total .t-l { color: var(--muted); font-size: 13px; }
.total .t-n { font-family: var(--font-display); font-size: 52px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.total .t-u { font-size: 18px; }
.total.bump .t-n { animation: bump .3s ease; color: var(--accent); }
.bdl { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 1.4em; }

.sizes { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.seg { min-width: 48px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-weight: 700; font-variant-numeric: tabular-nums; }
.seg.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.stepper { display: flex; align-items: center; gap: 4px; margin-left: auto; }
.stepper .v { min-width: 3.2em; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.stepper button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 18px; }
.sheetbtns { display: grid; grid-template-columns: 84px 1fr; gap: 10px; }
.sheetbtns .btn { min-height: 64px; font-size: 18px; }
.grid5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.grid5 button { height: 52px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.grid5 button:active, .seg:active, .stepper button:active { background: var(--accent-soft); }
.other { display: flex; gap: 8px; }
.other input { flex: 1; min-width: 0; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); padding: 0 12px; }

.entries { display: grid; }
.entry { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.entry:first-child { border-top: 0; }
.entry .e-l { flex: 1; }
.entry .e-t { font-size: 12px; color: var(--muted); }
.entry button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); color: var(--warn); font-size: 16px; }
.muted { color: var(--muted); font-size: 13px; margin: 0; }

.field { display: grid; gap: 4px; }
.field label { font-size: 12px; color: var(--muted); }
.field input, .field textarea, .txt {
  width: 100%; border-radius: 10px; border: 1px solid var(--line); background: var(--bg);
  padding: 9px 12px; min-height: 44px;
}
.field textarea { resize: vertical; min-height: 44px; }

.steps { margin: 0; padding-left: 1.4em; display: grid; gap: 6px; font-size: 14px; }
.steps b { color: var(--accent); }
.scanbox { width: 100%; min-height: 42vh; border-radius: var(--r); border: 2px dashed var(--accent); background: var(--surface); padding: 12px; line-height: 1.6; }
.inline { display: flex; gap: 8px; flex-wrap: wrap; }

.rv-clinic { display: grid; gap: 10px; }
.rv-head { display: flex; gap: 8px; align-items: center; }
.rv-head input { flex: 1; min-width: 0; font-weight: 700; }
.rv-drug { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 6px; }
.rv-drug .rv-top { display: flex; gap: 8px; }
.rv-drug .rv-top input { flex: 1; min-width: 0; font-weight: 700; }
.rv-pair { display: grid; grid-template-columns: 2.6em 1fr; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.x { flex: none; width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--warn); }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
details pre { white-space: pre-wrap; font-size: 12px; margin: 8px 0 0; }

.timing { display: grid; grid-template-columns: 3.6em 44px minmax(0, 1fr) 44px; gap: 8px; align-items: center; }
.timing input { width: 100%; min-width: 0; box-sizing: border-box; }
.timing .tl { font-weight: 700; font-family: var(--font-display); }
.timing input { height: 44px; text-align: center; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.timing button { height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 20px; }
.timing button.plus { background: var(--pack-soft); border-color: var(--pack); color: var(--pack); }
.pk-in { margin: 2px 0 10px calc(3.6em + 8px); font-size: 13px; line-height: 1.45; color: var(--ink-2, #555); }
.pk-in b { color: var(--pack); font-size: 14px; margin-right: 6px; }
.pk-in span { display: block; }
.pk-in.none { color: var(--muted, #999); }
.pk-total { text-align: right; font-weight: 700; color: var(--pack); font-variant-numeric: tabular-nums; }
.pick { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); cursor: pointer; }
.pick:first-child { border-top: 0; }
.pick.sel .check { background: var(--accent); border-color: var(--accent); }

.confirm { background: var(--warn-soft); border: 1px solid var(--warn); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; }
.confirm p { margin: 0; font-weight: 700; color: var(--warn); }
.menu-list { display: grid; gap: 10px; }
.menu-list .btn { text-align: left; min-height: 52px; }

.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.note { background: var(--bg); color: var(--ink-2, #555); font-weight: 500; border: 1px solid var(--line); }
.tag.pack { background: var(--pack); color: #fff; }
.rp-row { display: grid; grid-template-columns: 2em minmax(0, 1fr); gap: 6px; padding: 8px 0; border-top: 1px solid var(--line); }
.rp-row:first-of-type { border-top: 0; }
.rp-no { font-size: 20px; line-height: 1.2; font-weight: 700; color: var(--accent, #0e6a5a); }
.rp-dose { font-weight: 500; color: var(--ink-2, #555); }
.rp-pack { padding: 6px 0; }
.rp-warn .warnline { margin: 4px 0; }
.rp-row .tag { white-space: normal; max-width: 100%; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 13.5px; padding: 7px 10px; border-radius: 99px; border: 1px solid var(--line); background: #fff; color: inherit; cursor: pointer; min-height: 36px; }
.chip small { margin-left: 4px; font-size: 10.5px; opacity: .75; }
.chip.on { background: #0e6a5a; border-color: #0e6a5a; color: #fff; }
.ins .field > label small { margin-left: 6px; font-weight: 400; color: var(--ink-2, #666); }
.prep { border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin: 0 0 10px; background: var(--bg); }
.prep-when { display: flex; align-items: center; gap: 8px; margin: 8px 0; white-space: nowrap; }
.prep-when input { height: 40px; font: inherit; font-size: 16px; }
.ins input[type=date] { font: inherit; font-size: 16px; height: 40px; }
.rc-set { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: 4px 0 8px; }
.rc-set > div { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; }
.rc-set small { display: block; font-size: 11px; color: var(--ink-2, #666); }
.rc-set b { font-size: 16px; }
.rc-slot { border-top: 1px solid var(--line); padding: 6px 0; }
.rc-sh { display: flex; gap: 10px; align-items: baseline; margin: 2px 0; }
.rc-sh b { font-size: 16px; min-width: 2.6em; }
.rc-pc { margin-left: auto; font-weight: 700; color: var(--pack); }
.rc-short { color: var(--warn); font-weight: 700; }
.rc-it { display: grid; grid-template-columns: 1.8em minmax(0, 1fr) auto; gap: 4px; align-items: baseline; padding: 1px 0 1px 2.6em; font-size: 14px; }
.rc-it .rp-no { font-size: 15px; }
.rc-grid { border-collapse: collapse; margin: 8px 0; font-size: 12.5px; width: 100%; table-layout: fixed; }
.rc-grid caption { text-align: left; font-size: 11.5px; color: var(--ink-2, #666); padding-bottom: 2px; }
.rc-grid th, .rc-grid td { border: 1px solid var(--line); padding: 3px 1px; text-align: center; }
.rc-grid th { font-weight: 600; background: var(--bg); }
.rc-grid td.e { background: repeating-linear-gradient(45deg, #f4f4f4, #f4f4f4 4px, #e6e6e6 4px, #e6e6e6 8px); color: #888; }
.ins-out { font-family: inherit; white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 14px; line-height: 1.6; margin: 0 0 8px; user-select: text; -webkit-user-select: text; }
.okline { margin: 0; color: var(--accent); font-weight: 700; overflow-wrap: anywhere; }
.warnline { margin: 0; color: var(--warn); font-weight: 700; }
.cands { display: grid; gap: 6px; }
.cand {
  display: grid; gap: 2px; text-align: left; width: 100%; padding: 10px 12px; min-height: 48px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--bg);
}
.cand:active { background: var(--accent-soft); }
.cand .cn { font-weight: 700; overflow-wrap: anywhere; }
.cand .cs { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rv-badge { font-size: 12px; }
.rv-badge.ok { color: var(--accent); }
.rv-badge.ng { color: var(--warn); }
.filepick { display: grid; gap: 8px; }
.filepick input[type=file] { font-size: 14px; }
.ocr-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ocr-btns .btn { min-height: 56px; font-size: 16px; display: grid; place-items: center; text-align: center; }
.filebtn { cursor: pointer; }
.ocr-status { display: grid; gap: 6px; }
.ocr-bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.ocr-bar span { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.cam {
  position: fixed; inset: 0; z-index: 40; background: #000; display: flex; flex-direction: column;
}
.cam video { flex: 1; min-height: 0; width: 100%; object-fit: cover; background: #000; }
.cam .guide {
  position: absolute; left: max(20px, env(safe-area-inset-left, 0px)); right: max(20px, env(safe-area-inset-right, 0px));
  top: calc(env(safe-area-inset-top, 0px) + 70px); bottom: calc(env(safe-area-inset-bottom, 0px) + 150px);
  border: 2px dashed rgba(255,255,255,.85); border-radius: 14px; pointer-events: none;
}
.cam .cam-top {
  position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px;

<script>
(() => {
'use strict';

/* ================= データ ================= */
const KEY = 'jishiyaku.v1';
let state = { clinics: [], packs: [] };
const ui = { recent: [], undo: [], packMode: false, selected: [], search: '', panel: null, scanText: '',
             sid: '', label: '', createdAt: 0, reports: [] };

// 入力中の患者は localStorage に即時保存、患者ごとの一覧（再開用）は IndexedDB に保存
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const o = JSON.parse(raw);
      if (o && o.state) state = o.state;
      if (o && Array.isArray(o.recent)) ui.recent = o.recent;
      if (o && typeof o.scanText === 'string') ui.scanText = o.scanText;
      if (o && o.sid) { ui.sid = o.sid; ui.label = o.label || ''; ui.createdAt = o.createdAt || Date.now(); ui.reports = o.reports || []; }
    }
  } catch (e) { /* 保存領域が使えなくても動作は継続 */ }
  if (!ui.sid) { ui.sid = uid(); ui.createdAt = Date.now(); }
}
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({ state, recent: ui.recent, scanText: ui.scanText,
      sid: ui.sid, label: ui.label, createdAt: ui.createdAt, reports: ui.reports }));
  } catch (e) {}
  scheduleArchive();
}

let sessions = [], sessionsLoaded = false, archiveTimer = null;
const isEmptySession = () => !state.clinics.length && !ui.reports.length && !ui.label.trim();
function snapshot() {
  return { id: ui.sid, label: ui.label, createdAt: ui.createdAt, updatedAt: Date.now(),
           state: JSON.parse(JSON.stringify(state)), recent: ui.recent.slice(), reports: ui.reports.slice() };
}
async function archiveCurrent() {
  if (!sessionsLoaded) return;
  clearTimeout(archiveTimer);
  sessions = sessions.filter(s => s.id !== ui.sid);
  if (!isEmptySession()) sessions.unshift(snapshot());
  sessions.sort((a, b) => b.updatedAt - a.updatedAt);
  await idbSet('sessions', sessions);
}
function scheduleArchive() { clearTimeout(archiveTimer); archiveTimer = setTimeout(archiveCurrent, 800); }
function clearCurrent() {
  state = { clinics: [], packs: [] };
  ui.recent = []; ui.undo = []; ui.reports = []; ui.label = ''; ui.scanText = ''; ui.search = ''; ui.note = '';
  ui.sid = uid(); ui.createdAt = Date.now();
  const s = document.getElementById('search'); if (s) s.value = '';
}
async function startNewSession() { await archiveCurrent(); clearCurrent(); save(); }
async function resumeSession(id) {
  const s = sessions.find(x => x.id === id); if (!s) return;
  await archiveCurrent();
  clearCurrent();
  state = JSON.parse(JSON.stringify(s.state));
  ui.recent = s.recent || []; ui.reports = s.reports || []; ui.label = s.label || '';
  ui.sid = s.id; ui.createdAt = s.createdAt || Date.now();
  save();
}
async function deleteSession(id) {
  sessions = sessions.filter(s => s.id !== id);
  await idbSet('sessions', sessions);
  if (id === ui.sid) { clearCurrent(); save(); }
}
const fmtTime = t => new Date(t).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
const drugCount = st => (st.clinics || []).reduce((a, c) => a + c.drugs.length, 0);

const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const qty = n => String(Math.round(n * 100) / 100);
const $ = s => document.querySelector(s);

const displayName = d => (d.name || '').trim() || '（名称未入力）';
/* 外用薬：自動判定（薬品情報の切替で上書き可）。数量は「未開封◯本」「使いかけ◯本」で数える */
const EXT_RE = /(テープ|パップ|貼付|湿布|軟膏|クリーム|ローション|ゲル|点眼|点鼻|点耳|吸入|エアゾール|坐剤|坐薬|スプレー|噴霧|外用|塗布|患部|挿入)/;
function isExt(d) { return typeof d.ext === 'boolean' ? d.ext : EXT_RE.test((d.name || '') + (d.usage || '')); }
function extUnit(d) {
  if (d.extUnit) return d.extUnit;
  const s = (d.name || '') + (d.usage || '');
  if (/(テープ|パップ|貼付|湿布)/.test(s)) return '袋';
  if (/(坐剤|坐薬)/.test(s)) return '個';
  return '本';
}
function extCounts(d) {
  let full = 0, open = 0;
  for (const e of d.entries) { if (e.ext === 'open') open += e.count; else full += e.count; }
  return { full, open };
}
function extText(d) {
  const { full, open } = extCounts(d), u = extUnit(d), p = [];
  if (full) p.push(`${qty(full)}${u}`);
  if (open) p.push(`使いかけ${qty(open)}${u}`);
  return p.join('、');
}
function unit(d) {
  if (isExt(d)) return extUnit(d);
  const s = (d.name || '') + (d.dose || '');
  if (s.includes('カプセル')) return 'C';
  if (/(テープ|パップ|貼付|枚)/.test(s)) return '枚';
  if (/(散|顆粒|細粒|包)/.test(s)) return '包';
  return '錠';
}
const entryTotal = e => (e.size || 1) * e.count;
const total = d => d.entries.reduce((a, e) => a + entryTotal(e), 0);
function breakdown(d) {
  if (isExt(d)) return extText(d);
  const parts = [];
  const sizes = [...new Set(d.entries.filter(e => e.size).map(e => e.size))].sort((a, b) => b - a);
  for (const s of sizes) {
    const n = d.entries.filter(e => e.size === s).reduce((a, e) => a + e.count, 0);
    if (n) parts.push(`${s}×${qty(n)}`);
  }
  const loose = d.entries.filter(e => !e.size).map(e => qty(e.count));
  if (loose.length) parts.push(loose.join('+'));
  return parts.join(' + ');
}
const entryLabel = (e, u) => e.ext ? `${e.ext === 'open' ? '使いかけ' : '未開封'} ${qty(e.count)}${u}` : e.size ?`${e.size}${u}シート × ${qty(e.count)}` : `バラ ${qty(e.count)}${u}`;

function findDrug(id) {
  for (const c of state.clinics) {
    const d = c.drugs.find(x => x.id === id);
    if (d) return { drug: d, clinic: c };
  }
  return null;
}
const allIds = () => state.clinics.flatMap(c => c.drugs.map(d => d.id));
const newDrug = (name = '', dose = '', usage = '') => ({ id: uid(), name, dose, usage, sheetSize: 10, entries: [] });

const TIMINGS = [['wake', '起床時'], ['morning', '朝'], ['noon', '昼'], ['evening', '夕'], ['bedtime', '眠前']];
const packTotal = p => TIMINGS.reduce((a, [k]) => a + (p.counts[k] || 0), 0);
/* ---- 一包化の中身：時点ごとに1包に何錠入るか（半錠も1個と数える） ---- */
const T_OF_KEY = { wake: '起床時', morning: '朝', noon: '昼', evening: '夕', bedtime: '就寝前' };
const COUNTABLE = /^(錠|カプセル|丸|個)$/;
function amountAt(d, t) {
  // 戻り値：{ amt, unit } ／ null（この時点には入らない）／ { unknown: 理由 }
  const U = getU(d);
  if (U.prn || U.ext) return { unknown: U.prn ? '頓用' : '外用' };
  const unitD = doseUnit(d);
  const num = v => { const m = String(v || '').normalize('NFKC').replace(/^1回/, '').match(/^(\d+(?:\.\d+)?)\s*(\D*)$/); return m ? [+m[1], m[2] || ''] : null; };
  // 時点ごとに量が違う（「朝2錠・夕1錠」）
  if (U.unequal) {
    const re = /(起床時?|朝|昼|夕|就寝前|眠前|寝る前)\s*(\d+(?:\.\d+)?)\s*(錠|カプセル|丸|個|包|g|mL)?/g, map = {};
    for (const m of String(U.unequal).normalize('NFKC').matchAll(re)) map[/寝|眠/.test(m[1]) ? '就寝前' : /起床/.test(m[1]) ? '起床時' : m[1]] = [+m[2], m[3] || unitD];
    if (Object.keys(map).length) return map[t] ? { amt: map[t][0], unit: map[t][1] } : null;
  }
  const times = U.times || [];
  if (!times.length) return { unknown: '服用時点が未入力' };
  if (!times.includes(t)) return null;
  const pd = num(U.perDose);
  if (pd) return { amt: pd[0], unit: pd[1] || perDoseUnit(d) };
  const dd = num(d.dose);
  if (!dd) return { unknown: '1日量が未入力' };
  const n = U.perDay || times.length, a = dd[0] / n;
  // 1日量が整数なのに等分すると端数が出る（1日3錠・分2など）→ 朝2・夕1かもしれないので決めつけない
  if (Math.abs(a - Math.round(a)) > 1e-6 && (Number.isInteger(dd[0]) || Math.abs(a * 2 - Math.round(a * 2)) > 1e-6))
    return { unknown: `1日${d.dose}・${n}回では時点ごとの量が決まりません` };
  return { amt: a, unit: dd[1] || unitD };
}
function packContents(pk) {
  const drugs = pk.drugIds.map(id => findDrug(id)?.drug).filter(Boolean);
  const res = {}, unknown = [];
  for (const [k] of TIMINGS) res[k] = { pieces: 0, items: [], other: [] };
  for (const d of drugs) {
    let bad = '';
    for (const [k] of TIMINGS) {
      const a = amountAt(d, T_OF_KEY[k]);
      if (!a) continue;
      if (a.unknown) { bad = a.unknown; break; }
      if (!a.amt) continue;
      if (COUNTABLE.test(a.unit)) {
        const pieces = Math.ceil(a.amt - 1e-9);   // 半錠も1個
        res[k].pieces += pieces;
        res[k].items.push({ d, amt: a.amt, unit: a.unit, pieces });
      } else res[k].other.push({ d, amt: a.amt, unit: a.unit });
    }
    if (bad) unknown.push({ d, why: bad });
  }
  return { res, unknown };
}
const pkName = d => displayName(d).replace(/「[^」]*」/g, '').replace(/\s+/g, '').slice(0, 16);
const fmtAmt = x => x === 0.5 ? '½' : Number.isInteger(x) ? String(x) : Number.isInteger(x - 0.5) ? `${x - 0.5}½` : String(x);

const packSummary = p => TIMINGS.filter(([k]) => p.counts[k] > 0).map(([k, l]) => l + p.counts[k]).join(' ');

function touch(id) {
  ui.recent = [id, ...ui.recent.filter(x => x !== id)].slice(0, 8);
}

/* ================= 数量操作 ================= */
function addHeat(id, size, count, ext) {
  const r = findDrug(id);
  if (!r || !count) return;
  ui.note = '';
  const e = { id: uid(), size: size || null, count, at: Date.now() };
  if (ext) e.ext = ext;
  r.drug.entries.push(e);
  touch(id);
  ui.undo.push({ drugId: id, entryId: e.id, msg: `${displayName(r.drug)}  ${entryLabel(e, unit(r.drug))}` });
  if (ui.undo.length > 50) ui.undo.shift();
  save();
  refresh(id);
}
function removeEntry(id, eid) {
  const r = findDrug(id); if (!r) return;
  r.drug.entries = r.drug.entries.filter(e => e.id !== eid);
  ui.undo = ui.undo.filter(u => u.entryId !== eid);
  save(); refresh();
}
function removeLastSheet(id, size) {
  const r = findDrug(id); if (!r) return;
  const list = r.drug.entries.filter(e => e.size === size);
  const e = list[list.length - 1];
  if (!e) return;
  if (e.count > 1) { e.count -= 1; save(); refresh(); }
  else removeEntry(id, e.id);
}
function removeLastExt(id, kind) {
  const r = findDrug(id); if (!r) return;
  const list = r.drug.entries.filter(e => (e.ext || 'full') === kind && !e.size);
  const e = list[list.length - 1];
  if (!e) return;
  if (e.count > 1) { e.count -= 1; save(); refresh(); }
  else removeEntry(id, e.id);
}
function undoLast() {
  const u = ui.undo.pop(); if (!u) return;
  const r = findDrug(u.drugId);
  if (r) r.drug.entries = r.drug.entries.filter(e => e.id !== u.entryId);
  save(); refresh();
}

/* ================= 画像OCR（NDLOCR-Lite または Tesseract・端末内で処理） =================
   エンジンと日本語データはこのページと一緒に置いたファイルから読み込む（外部送信なし） */
const OCR = { worker: null, loading: null, queue: Promise.resolve(), pending: 0, status: '', progress: 0, pages: 0 };
const assetURL = f => new URL(f, location.href).href;

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error('load ' + src));
    document.head.appendChild(s);
  });
}
function ocrStatus(text, progress) {
  OCR.status = text;
  if (progress != null) OCR.progress = progress;
  const box = $('#ocrStatus'), msg = $('#ocrMsg'), bar = $('#ocrBar');
  if (box) box.hidden = !text;
  if (msg) msg.textContent = text;
  if (bar) bar.style.width = Math.round(OCR.progress * 100) + '%';
  const cm = $('#camMsg');
  if (cm && !$('#cam').hidden) cm.textContent = OCR.pending ? `読み取り中…（残り${OCR.pending}枚）撮影は続けられます` : '1ページずつ枠に合わせて撮影';
}
const STEP = {
  'loading tesseract core': '準備中（OCRエンジン）', 'initializing tesseract': '準備中',
  'loading language traineddata': '準備中（日本語データ）', 'initializing api': '準備中',
  'recognizing text': '文字を読み取り中'
};
async function getWorker() {
  if (OCR.worker) return OCR.worker;
  if (!OCR.loading) OCR.loading = (async () => {
    if (!window.Tesseract) {
      try { await loadScript('tesseract.min.js'); }
      catch (e) { await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js'); }
    }
    const w = await Tesseract.createWorker('jpn', 1, {
      workerPath: assetURL('worker.min.js'),
      workerBlobURL: false,
      corePath: assetURL('tesseract-core-lstm.wasm.js'),
      langPath: assetURL('./').replace(/\/$/, ''),
      logger: m => {
        if (!m || !m.status) return;
        const label = STEP[m.status] || '処理中';
        ocrStatus(`${label}… ${Math.round((m.progress || 0) * 100)}%${OCR.pending > 1 ? `（残り${OCR.pending}枚）` : ''}`, m.progress || 0);
      }
    });
    await w.setParameters({ tessedit_pageseg_mode: '6', preserve_interword_spaces: '1' });
    OCR.worker = w;
    return w;
  })().catch(err => { OCR.loading = null; throw err; });
  return OCR.loading;
}

// 前処理：長辺2400pxに縮小し、グレースケール＋明るさの幅を広げる
async function prepareImage(src) {
  let bmp;
  if (src instanceof HTMLCanvasElement) bmp = src;
  else {
    try { bmp = await createImageBitmap(src, { imageOrientation: 'from-image' }); }
    catch (e) {
      bmp = await new Promise((res, rej) => {
        const img = new Image(); img.onload = () => res(img); img.onerror = rej;
        img.src = URL.createObjectURL(src);
      });
    }
  }
  const W = bmp.width || bmp.naturalWidth, H = bmp.height || bmp.naturalHeight;
  const scale = Math.min(1, 2400 / Math.max(W, H));
  const c = document.createElement('canvas');
  c.width = Math.round(W * scale); c.height = Math.round(H * scale);
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(bmp, 0, 0, c.width, c.height);
  const im = g.getImageData(0, 0, c.width, c.height), d = im.data;
  for (let i = 0; i < d.length; i += 4) d[i] = (d[i] * 299 + d[i + 1] * 587 + d[i + 2] * 114) / 1000 | 0;
  // 照明むら（影）の補正：紙の明るさを推定して割る（縮小 → 最大値フィルタ → ぼかし → 拡大）
  const bw = Math.max(8, Math.round(c.width / 24)), bh = Math.max(8, Math.round(c.height / 24));
  let small = new Float32Array(bw * bh);
  for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++) {
    let mx = 0;
    const x0 = Math.floor(x * c.width / bw), x1 = Math.floor((x + 1) * c.width / bw), y0 = Math.floor(y * c.height / bh), y1 = Math.floor((y + 1) * c.height / bh);
    for (let yy = y0; yy < y1; yy += 2) for (let xx = x0; xx < x1; xx += 2) { const v = d[(yy * c.width + xx) * 4]; if (v > mx) mx = v; }
    small[y * bw + x] = mx;
  }
  const filt = (src, fn) => {
    const out = new Float32Array(bw * bh);
    for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++) {
      const vals = [];
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const xx = Math.min(bw - 1, Math.max(0, x + dx)), yy = Math.min(bh - 1, Math.max(0, y + dy));
        vals.push(src[yy * bw + xx]);
      }
      out[y * bw + x] = fn(vals);
    }
    return out;
  };
  small = filt(small, v => Math.max(...v));
  for (let k = 0; k < 2; k++) small = filt(small, v => v.reduce((a, b) => a + b, 0) / v.length);
  const hist = new Uint32Array(256);
  for (let y = 0; y < c.height; y++) {
    const fy = Math.min(bh - 1.001, Math.max(0, (y + 0.5) * bh / c.height - 0.5)), iy = fy | 0, ty = fy - iy;
    for (let x = 0; x < c.width; x++) {
      const fx = Math.min(bw - 1.001, Math.max(0, (x + 0.5) * bw / c.width - 0.5)), ix = fx | 0, tx = fx - ix;
      const a = small[iy * bw + ix], b = small[iy * bw + ix + 1], cc = small[(iy + 1) * bw + ix], dd = small[(iy + 1) * bw + ix + 1];
      const bgv = (a * (1 - tx) + b * tx) * (1 - ty) + (cc * (1 - tx) + dd * tx) * ty;
      const i = (y * c.width + x) * 4;
      const v = Math.min(255, d[i] / Math.max(1, bgv) * 255) | 0;
      d[i] = v; hist[v]++;
    }

  let lo = 0, hi = 255, acc = 0;
  for (; lo < 255; lo++) { acc += hist[lo]; if (acc > total * 0.01) break; }
  acc = 0;
  for (; hi > 0; hi--) { acc += hist[hi]; if (acc > total * 0.4) break; }   // 紙の部分を白に寄せる
  const span = Math.max(1, hi - lo);
  for (let i = 0; i < d.length; i += 4) {
    const v = Math.max(0, Math.min(255, (d[i] - lo) * 255 / span));
    d[i] = d[i + 1] = d[i + 2] = v;
  }
  g.putImageData(im, 0, 0);
  return c;
}

  for (const p of list) {

    name = name || '医療機関不明';

    if (!c) { c = { id: uid(), name, drugs: [] }; clinics.push(c); }
    for (const x of p.drugs || []) {
      // 名前の後ろにくっついた量（「 3錠」など）は外す
      const nm = normalize(String(x.name || '')).trim().replace(/\s+\d+(?:\.\d+)?\s*(?:錠|カプセル|包|g|mL|枚|本|個|瓶)\s*$/, '');

// 行の検出：正方形に余白を足して800×800に縮小、ImageNetの平均・分散で正規化

    const b = [boxes[i * 4] * k, boxes[i * 4 + 1] * k, boxes[i * 4 + 2] * k, boxes[i * 4 + 3] * k].map((v, j) => Math.round(Math.max(0, Math.min(j % 2 ? H : W, v))));

    if (keep.some(q => { const [X0, Y0, X1, Y1] = q.box; const iw = Math.max(0, Math.min(x1, X1) - Math.max(x0, X0)), ih = Math.max(0, Math.min(y1, Y1) - Math.max(y0, Y0)); return iw * ih / Math.min(a, (X1 - X0) * (Y1 - Y0)) > 0.5; })) continue;
    keep.push(d);

async function ndlReadLine(canvas, box, n) {

    let iy = Math.floor(sy); const ty = sy - iy; if (iy >= ch - 1) iy = ch - 1;

    for (let dx = 0; dx < IW; dx++) {
      let sx = (dx + 0.5) * fx - 0.5; if (sx < 0) sx = 0;
      let ix = Math.floor(sx); const tx = sx - ix; if (ix >= cw - 1) ix = cw - 1;
      const ix1 = Math.min(cw - 1, ix + 1), o = dy * IW + dx;

async function ndlRecognize(canvas, onStatus = () => {}) {

    onStatus(`文字を読み取り中… ${i + 1}/${dets.length}行`, 0.1 + 0.9 * i / dets.length);
    const d = dets[i];
    const [bx0, by0, bx1, by1] = d.box, r = Math.max(bx1 - bx0, by1 - by0) / Math.max(1, Math.min(bx1 - bx0, by1 - by0));
    let n = r < 10 ? 30 : r < 16 ? 50 : 100, text = await ndlReadLine(canvas, d.box, n);
    if (n === 30 && text.length >= 25) { n = 50; text = await ndlReadLine(canvas, d.box, 50); }
    if (n === 50 && text.length >= 45) { n = 100; text = await ndlReadLine(canvas, d.box, 100); }
    if (n === 100 && text.length >= 98 && d.box[3] - d.box[1] < d.box[2] - d.box[0]) {
      const [x0, y0, x1, y1] = d.box, xm = (x0 + x1) >> 1;
      text = await ndlReadLine(canvas, [x0, y0, xm, y1], 100) + await ndlReadLine(canvas, [xm, y0, x1, y1], 100);
    }
    lines.push({ box: d.box, text, conf: d.conf });
  }
  return lines;
}

// 端末内OCRの切り替え：GitHub Pages版は NDLOCR-Lite（既定）、Claude上の版は Tesseract
const ocrEngine = () => { if (!window.JISHIYAKU_SITE) return 'tess'; try { return localStorage.getItem('jishiyaku.ocr') || 'ndl'; } catch (e) { return 'ndl'; } };
async function ndlCached() {
  try { const c = await caches.open(NDL.ver); const ks = await c.keys(); return ['deim', 'parseq30', 'parseq50', 'parseq100'].every(n => ks.some(k => k.url.endsWith('/' + n + '.onnx'))); } catch (e) { return false; }
}
// 撮影画像を向きを直して読み込む（色はそのまま。長辺3000pxまで）
async function ndlCanvas(src) {
  let bmp = src;
  if (!(src instanceof HTMLCanvasElement)) {
    try { bmp = await createImageBitmap(src, { imageOrientation: 'from-image' }); }
    catch (e) { bmp = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(src); }); }
  }
  const W = bmp.width || bmp.naturalWidth, H = bmp.height || bmp.naturalHeight, sc = Math.min(1, 3000 / Math.max(W, H));
  if (sc === 1 && src instanceof HTMLCanvasElement) return src;
  const c = document.createElement('canvas'); c.width = Math.round(W * sc); c.height = Math.round(H * sc);
  const g = c.getContext('2d', { willReadFrequently: true }); g.imageSmoothingQuality = 'high';
  g.drawImage(bmp, 0, 0, c.width, c.height);
  return c;
}
// NDLOCRの半角濁点（ﾞ）は「'」として出るので、直前のカナと合わせる（ﾟも同じ記号になるが、照合では濁点・半濁点を区別しない）
function ndlFixKana(t) {
  return t.replace(/([カ-トハ-ホウｦ-ﾝ])\s*['’"”]/g, (m, ch) => {
    if (ch === 'ウ') return 'ヴ';
    const v = String.fromCharCode(ch.charCodeAt(0) + 1);
    return /[ガ-ドバ-ボ]/.test(v) ? v : ch;
  });
}
function ndlFixKanaRest(t) {
  return t.replace(/([ァ-ヴー])['’"”]/g, '$1');   // 既に濁点が付いた字などの後ろに残った記号は外す
}
// 末尾の数量（1錠・50g・7枚など）。名前の規格（5mg、0.5%）は含めない
const NDL_DOSE = /^(.*?[^\d.,])\s*((?:\d+(?:[.,]\d+)?)\s*(?:錠|カプセル|Cap|cap|包|枚|本|個|瓶|袋|筒|キット|吸入|滴|噴霧|g|ｇ|mL|ml|m[1lI])|[×xX]\s*\d+\s*(?:日分|回分|調剤))\s*$/;
// 行（文字列と枠）→ 解析用の形式。1文字ずつ位置を割り振り、末尾の数量は右端の列に置く
function ndlToPage(lines) {
  const out = [];
  for (const l of lines) {
    const [x0, y0, x1, y1] = l.box, h = y1 - y0;
    if (x1 - x0 < h) continue;                    // 縦書きは対象外
    let t = ndlFixKanaRest(ndlFixKana(normalize(l.text))).replace(/\s+/g, ' ').trim()
      .replace(/(\d)[OoＯ](?=\s*(?:m[lLI1]|g|錠|%|\d))/g, '$10')            // 「6Oml」→「60mL」
      .replace(/『/g, '「').replace(/』/g, '」')
      .replace(/(^|[一-龥])[-－‐](?=[一-龥])/g, '$1一');                     // 「-宮市」→「一宮市」
    if (!t) continue;
    const segs = [];
    const m = t.match(NDL_DOSE);
    if (m && m[1].trim() && !/[×xX]/.test(m[2])) {
      const dose = m[2].replace(/\s+/g, '').replace(/m[1lI]$/, 'mL').replace(/,/, '.');
      const dw = Math.min((x1 - x0) * 0.25, h * 0.9 * dose.length);
      segs.push([m[1].trim(), x0, Math.max(x0 + 1, x1 - dw - h * 3)], [dose, x1 - dw, x1]);
    } else segs.push([t, x0, x1]);
    const words = [];
    for (const [s, a, b] of segs) {
      if (segs.length > 1 && s === segs[1][0]) { words.push({ text: s, bbox: { x0: Math.round(a), y0, x1: Math.round(b), y1 } }); continue; }   // 数量は1語のまま
      const chars = Array.from(s), cw = (b - a) / Math.max(1, chars.length);
      chars.forEach((ch, k) => { if (ch !== ' ') words.push({ text: ch, bbox: { x0: Math.round(a + k * cw), y0, x1: Math.round(a + (k + 1) * cw), y1 } }); });
    }
    if (words.length) out.push({ bbox: { x0, y0, x1, y1 }, words, ndlText: t });
  }
  return out;
}

function ocrImage(src) {
  OCR.pending++;
  ocrStatus(`読み取り待ち（${OCR.pending}枚）`, 0);
  // LLMサーバは端末内OCRと並行して呼ぶ（30秒前後かかる）
  const llmJob = llmReady() ? llmReadImage(src).then(j => ({ j }), e => ({ err: e.message || String(e) })) : null;

    try {
      if (ocrEngine() === 'ndl') {
        let lines = null, ndlErr = '';

          const cv = await ndlCanvas(src);
          const raw = await ndlRecognize(cv, (t, p) => ocrStatus(t + (OCR.pending > 1 ? `（残り${OCR.pending}枚）` : ''), p));
          lines = ndlToPage(raw);
        } catch (e) { console.error(e); ndlErr = e?.message || String(e); }
        if (lines) {
          const text = lines.map(l => l.ndlText).join('\n');
          let llm = null, llmErr = '';
          if (llmJob) {
            ocrStatus('LLMサーバで読み取り中…（30秒ほどかかります）', 0.9);
            const r = await llmJob;
            if (r.j) llm = r.j; else llmErr = r.err;
          }
          OCR.pages++;
          appendScanText(text);
          ui.scanPages = [...(ui.scanPages || []), { text, lines, wide: [], engine: 'ndl', llm, llmErr }];
          try { window.__jishiyakuOcr = ui.scanPages; } catch (e) {}
          ui.scanPagesText = ui.scanText;
          OCR.pending--;
          const llmNote = llmJob ? (llm ? '（LLMで読み取り）' : `（LLMは使えませんでした：${llmErr}。端末内のOCRで読み取りました）`) : '';
          ocrStatus(OCR.pending ? `読み取り中…（残り${OCR.pending}枚）` : `${OCR.pages}ページ読み取りました${llmNote}。内容を確認して「解析する」を押してください。`, 1);
          return;
        }
        ocrStatus(`NDLOCR-Liteを使えなかったため、Tesseractで読み取ります（${ndlErr}）`, 0);
      }
      const canvas = await prepareImage(src);
      const w = await getWorker();
      const { data } = await w.recognize(canvas, {}, { text: true, blocks: true });
      const text = cleanOcrText(data.text || '');
      const lines = [];
      for (const b of data.blocks || []) for (const p of b.paragraphs || []) for (const l of p.lines || [])
        lines.push({ bbox: l.bbox, words: (l.words || []).map(w => ({ text: w.text, bbox: w.bbox })) });
      // 半角カタカナ対策：横に2倍に引き伸ばした画像でも読み、行ごとに使い分ける
      let wide = [];
      // 照合できない薬名がある場合だけ、横2倍でもう一度読む（時間がかかるため）
      const needWide = Master.ready && parseLayout([{ lines }]).some(c => c.drugs.some(d => !d.yj));
      if (needWide) {
        ocrStatus('半角カナ対策の読み取り中…', 0);
        const w2 = document.createElement('canvas');
        w2.width = canvas.width * 2; w2.height = canvas.height;
        w2.getContext('2d').drawImage(canvas, 0, 0, w2.width, w2.height);
        const r2 = await w.recognize(w2, {}, { text: false, blocks: true });
        for (const b of r2.data.blocks || []) for (const p of b.paragraphs || []) for (const l of p.lines || [])
          wide.push({ bbox: { x0: l.bbox.x0 / 2, x1: l.bbox.x1 / 2, y0: l.bbox.y0, y1: l.bbox.y1 }, words: (l.words || []).map(x => ({ text: x.text, bbox: { x0: x.bbox.x0 / 2, x1: x.bbox.x1 / 2, y0: x.bbox.y0, y1: x.bbox.y1 } })) });
      }
      let llm = null, llmErr = '';
      if (llmJob) {
        ocrStatus('LLMサーバで読み取り中…（30秒ほどかかります）', 0.9);
        const r = await llmJob;
        if (r.j) llm = r.j; else llmErr = r.err;
      }
      OCR.pages++;
      appendScanText(text);
      ui.scanPages = [...(ui.scanPages || []), { text, lines, wide, llm, llmErr }];
      try { window.__jishiyakuOcr = ui.scanPages; } catch (e) {}
      ui.scanPagesText = ui.scanText;
      OCR.pending--;
      const llmNote = llmJob ? (llm ? '（LLMで読み取り）' : `（LLMは使えませんでした：${llmErr}。端末内のOCRで読み取りました）`) : '';
      ocrStatus(OCR.pending ? `読み取り中…（残り${OCR.pending}枚）` : `${OCR.pages}ページ読み取りました${llmNote}。内容を確認して「解析する」を押してください。`, 1);
    } catch (err) {
      OCR.pending--;
      console.error(err);
      ocrStatus('読み取れませんでした。通信できる状態でページを開き直してから、もう一度お試しください。（' + (err?.message || err) + '）', 0);
    }
  });
  return OCR.queue;
}


/* ---- 持参薬レポートの取り込み：画像 → 文字（端末内OCR、有効ならLLMで書き起こし）→ parseReport ---- */
const RPT = { text: '', doc: null };
try { RPT.text = localStorage.getItem('jishiyaku.rpt') || ''; } catch (e) {}
const rptSave = () => { try { localStorage.setItem('jishiyaku.rpt', RPT.text); } catch (e) {} };
RPT.instr = null;
// レポート本文を読み直し、指示も取り出す
function rptReparse() { RPT.doc = parseReport(RPT.text); RPT.instr = RPT.doc.instr; rptSave(); }
// フォームで直した指示を、本文の区切りより下に書き戻す
function rptApplyInstr() {
  const ls = RPT.text.replace(/\r/g, '').split('\n');
  let si = ls.findIndex(l => INSTR_SEP.test(l));
  if (si < 0) si = ls.findIndex(l => INSTR_HEAD.test(normalize(l.trim())));
  const top = (si >= 0 ? ls.slice(0, si) : ls).join('\n').replace(/\s*$/, '');
  RPT.text = top + '\n\n' + instrText(RPT.instr);
  rptReparse();
  renderPanel();
}
const LLM_TRANSCRIBE = `画像に写っている「持参薬レポート」の文字を、そのまま書き写してください。
規則：
- 【持参薬】の見出しから、最後の「※」で始まる行まで。それ以外の画面の文字（メニュー、患者名、日付など）は書かない。
- 文字を変えない・補わない・並べ替えない。丸数字（①②…㉑…）、●、・・・・・、（）、※ はそのまま。
- 改行は画像の行どおり。空行は省いてよい。
- 読めない文字は「?」にする。
- 説明や前置きは書かず、本文だけを返す。`;
async function llmTranscribe(src) {
  const c = llmCfg(), url = await toJpegDataURL(src, 2400);
  const r = await llmFetch('/v1/chat/completions', {
    model: c.model, temperature: 0, max_tokens: 3000,
    chat_template_kwargs: { enable_thinking: false }, experimental_speed_projection: false,
    messages: [{ role: 'system', content: LLM_TRANSCRIBE },
      { role: 'user', content: [{ type: 'text', text: 'この画像の持参薬レポートを書き写してください。' }, { type: 'image_url', image_url: { url } }] }]

  return (r?.choices?.[0]?.message?.content || '').replace(/^```[a-z]*\n?|```$/gm, '').trim();
}
async function imageText(src) {
  if (ocrEngine() === 'ndl') {
    try {
      const raw = await ndlRecognize(await ndlCanvas(src), (t, p) => ocrStatus(t, p));
      let ls = raw.filter(l => l.box[2] - l.box[0] > l.box[3] - l.box[1]);
      // 【持参薬】の見出しがあれば、それより左にある別の列（電子カルテのメニューなど）は捨てる
      const head = ls.find(l => /持参/.test(l.text) && l.text.length <= 8);
      if (head) { const hh = head.box[3] - head.box[1]; ls = ls.filter(l => l.box[2] > head.box[0] - hh); }
      return ls.map(l => l.text).join('\n');
    } catch (e) { console.error(e); ocrStatus('NDLOCR-Liteを使えなかったため、Tesseractで読み取ります', 0); }
  }
  const w = await getWorker();
  const { data } = await w.recognize(await prepareImage(src), {}, { text: true });
  return cleanOcrText(data.text || '');
}
function rptImage(src) {
  OCR.pending++;
  ocrStatus(`読み取り待ち（${OCR.pending}枚）`, 0);
  const llmJob = llmReady() ? llmTranscribe(src).then(t => ({ t }), e => ({ err: e.message || String(e) })) : null;
  OCR.queue = OCR.queue.then(async () => {
    try {
      let text = await imageText(src), note = '';
      if (llmJob) {
        ocrStatus('LLMサーバで書き起こし中…（30秒ほどかかります）', 0.9);
        const r = await llmJob;
        if (r.t && /[①-⑳●]|・{3,}/.test(r.t)) { text = r.t; note = '（LLMで書き起こし）'; }
        else note = `（LLMは使えませんでした${r.err ? '：' + r.err : ''}。端末内のOCRで読み取りました）`;
      }
      RPT.text = (RPT.text.trim() ? RPT.text.replace(/\s*$/, '') + '\n' : '') + text;
      rptReparse();
      OCR.pending--;
      ocrStatus(OCR.pending ? `読み取り中…（残り${OCR.pending}枚）` : `読み取りました${note}。下の文字と結果を確認してください。`, 1);
      if (ui.panel?.type === 'rpt') renderPanel();
    } catch (err) {
      OCR.pending--; console.error(err);
      ocrStatus('読み取れませんでした（' + (err?.message || err) + '）', 0);
    }
  });
  return OCR.queue;
}

/* ---- GS1バーコード（PTPのGS1データバー）を無音カメラで読む ----
   zxing-cpp（WASM）をページと一緒に置き、端末内で読み取る */
const BC = { ready: null, timer: null, busy: false, onFound: null };
function loadBarcode() {
  if (!BC.ready) BC.ready = (async () => {
    if (!window.ZXingWASM) await loadScript('zxing-reader.js');
    ZXingWASM.prepareZXingModule({ overrides: { locateFile: (p, prefix) => p.endsWith('.wasm') ? assetURL('zxing_reader.wasm') : prefix + p }, fireImmediately: true });
  })().catch(e => { BC.ready = null; throw e; });
  return BC.ready;
}
const canScanGS1 = () => !!window.JISHIYAKU_SITE && !!navigator.mediaDevices?.getUserMedia;
async function scanTick() {
  const v = $('#camVideo');
  if (BC.busy || !v.videoWidth || !Cam.stream) return;
  BC.busy = true;
  try {
    // 枠（画面中央の帯）の部分だけを切り出して読む
    const W = v.videoWidth, H = v.videoHeight;
    const cw = Math.round(W * 0.9), ch = Math.round(H * 0.45);
    const scale = Math.min(1, 1600 / cw);
    const c = scanTick.c || (scanTick.c = document.createElement('canvas'));
    c.width = Math.round(cw * scale); c.height = Math.round(ch * scale);
    const g = c.getContext('2d', { willReadFrequently: true });
    g.drawImage(v, (W - cw) / 2, (H - ch) / 2, cw, ch, 0, 0, c.width, c.height);
    const res = await ZXingWASM.readBarcodes(g.getImageData(0, 0, c.width, c.height), {
      formats: ['DataBar', 'DataBarLimited', 'DataBarExpanded', 'EAN-13', 'Code128', 'DataMatrix', 'QRCode'],
      tryHarder: true, maxNumberOfSymbols: 4
    });
    for (const r of res || []) {
      const gtin = parseGS1(r.text);
      if (!gtin) continue;
      const it = lookupGS1(gtin);
      try { navigator.vibrate?.(40); } catch (e) {}
      if (it) { const f = BC.onFound; camClose(); f && f(it, gtin); return; }
      $('#camMsg').textContent = `GS1 ${gtin} はマスターにありません。別の面を映すか、名前で探してください。`;
    }
  } catch (e) { console.error(e); }
  finally { BC.busy = false; }
}
async function scanGS1(onFound) {
  BC.onFound = onFound;
  try { await loadBarcode(); } catch (e) { ui.note = 'バーコード読み取りの準備に失敗しました。通信できる状態で開き直してください。'; renderPanel(); return; }
  if (!(await camOpen('gs1'))) return;
  BC.timer = setInterval(scanTick, 200);
}

/* ---- 無音カメラ（ページがカメラを使える環境のみ） ---- */
const Cam = { stream: null, torch: false, shots: 0, mode: 'ocr' };
async function camOpen(mode = 'ocr') {
  Cam.mode = mode;
  const note = $('#camNote');
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('unsupported');
    Cam.stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 3840 }, height: { ideal: 2160 } }
    });
  } catch (e) {
    ui.camBlocked = true;
    if (note) note.hidden = false;
    if (mode === 'gs1') { ui.note = 'カメラを使えませんでした。設定でカメラの使用を許可してください。'; renderPanel(); }
    return false;
  }
  const v = $('#camVideo');
  v.srcObject = Cam.stream;
  try { await v.play(); } catch (e) {}
  const gs1 = mode === 'gs1';
  $('#cam').classList.toggle('gs1', gs1);
  $('.cam .shutter').hidden = gs1;
  Cam.shots = 0; $('#camCount').textContent = gs1 ? 'GS1読み取り' : '撮影 0枚';
  $('#camMsg').textContent = gs1 ? 'PTPシートのバーコードを枠の中に映してください' : mode === 'rpt' ? 'レポートの画面を枠に合わせて撮影（長いときは分けて撮影）' : '1ページずつ枠に合わせて撮影';
  $('#cam').hidden = false;
  if (gs1) return true;
  ocrStatus(OCR.status);
  if (ocrEngine() === 'ndl') ndlLoad((t, p) => { if (!OCR.pending) ocrStatus(t, p); }).then(() => { if (!OCR.pending) ocrStatus(''); }).catch(() => {});   // 撮影中にエンジンを準備しておく
  else getWorker().catch(() => {});
  return true;
}
function camClose() {
  clearInterval(BC.timer); BC.timer = null;
  if (Cam.stream) Cam.stream.getTracks().forEach(t => t.stop());
  Cam.stream = null; Cam.torch = false;
  $('#cam').hidden = true;
}
function camShot() {
  const v = $('#camVideo');
  if (!v.videoWidth) return;
  const c = document.createElement('canvas');
  c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext('2d').drawImage(v, 0, 0);
  const f = $('#camFlash'); f.classList.add('on'); requestAnimationFrame(() => requestAnimationFrame(() => f.classList.remove('on')));
  try { navigator.vibrate?.(30); } catch (e) {}
  Cam.shots++; $('#camCount').textContent = `撮影 ${Cam.shots}枚`;
  if (Cam.mode === 'rpt') rptImage(c); else ocrImage(c);
  ocrStatus(OCR.status);
}
async function camTorch() {
  const track = Cam.stream?.getVideoTracks()[0];
  if (!track) return;
  try { await track.applyConstraints({ advanced: [{ torch: !Cam.torch }] }); Cam.torch = !Cam.torch; }
  catch (e) { $('#camTorchBtn').textContent = 'ライト非対応'; }
}

/* ================= 解析（お薬手帳テキスト → 構造化） ================= */
const CLINIC = /(病院|医院|クリニック|診療所|医療センター|内科|外科|眼科|皮膚科|耳鼻|歯科|整形|小児科|泌尿器|婦人科|心療|精神科)/;

const NOISE = /(TEL|Tel|電話|FAX|〒|住所|薬剤師|お薬手帳|調剤日|処方日|交付日|患者|生年月日|保険|負担|領収|点数|注意|お大事|様$|効能|効果[)）]|引換券|医師名|病棟|診療科|さんのお薬|処方されています|先生$)/;
const FORM = /(錠|カプセル|散|顆粒|細粒|シロップ|DS|液|テープ|パップ|軟膏|クリーム|ローション|ゲル|点眼|点鼻|吸入|エアゾール|坐剤|坐薬|貼付剤|注|OD|mg|μg|mL)/;
const USAGE_SRC = '(1日\\s*\\d+\\s*回|1回|分\\s*\\d|毎食|朝食|昼食|夕食|食前|食後|食間|就寝前|寝る前|眠前|起床時|頓用|頓服|\\d+\\s*日分|\\d+\\s*回分|時間毎|時間おき|疼痛時|発熱時|不眠時|便秘時|必要時|適宜|塗布|患部|貼付)';
const UNIT_SRC = '(錠|カプセル|C|包|g|mL|ml|枚|本|個|滴|袋|T|瓶|キット|噴霧|吸入)';
const DOSE_CORE = '((1日|1回)\\s*)?\\d+(\\.\\d+)?\\s*' + UNIT_SRC;
const USAGE = new RegExp(USAGE_SRC);
const DOSE_END = new RegExp(DOSE_CORE + '\\s*$');
const DOSE_ONLY = new RegExp('^' + DOSE_CORE + '\\s*$');
const PER_DOSE = new RegExp('1回\\s*\\d+(\\.\\d+)?\\s*' + UNIT_SRC);

const OCR_FIXES = [];
try {
  for (const [w, r] of [['一', 'ー'], ['口', 'ロ'], ['力', 'カ'], ['工', 'エ'], ['卜', 'ト'], ['夕', 'タ']]) {
    OCR_FIXES.push([new RegExp(`(?<=[ァ-ヴー])${w}|${w}(?=[ァ-ヴー])`, 'g'), r]);
  }
} catch (e) { /* 古いiOSでは補正なし */ }

function normalize(s) {
  let t = (s || '').normalize('NFKC').replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
           .replace(/　/g, ' ').replace(/µ/g, 'μ');
  for (const [re, r] of OCR_FIXES) t = t.replace(re, r);
  return t.replace(/[ \t]{3,}/g, '  ').trim();
}
function isDrugLine(s) {
  if (!FORM.test(s)) return false;
  const st = structUsage(s).startStrict;
  const head = st >= 0 ? fixUsageOcr(s).slice(0, st) : s;
  const stripped = head.replace(/(カプセル|シロップ|ドライシロップ|テープ|パップ|クリーム|ローション|ゲル|エアゾール)/g, '');
  return /[ァ-ヴー]{3,}/.test(stripped)
    || /\d+(\.\d+)?\s*(mg|μg|%|mL|単位)/.test(head)
    || /(【般】|\[般\]|\(般\))/.test(head)
    || /[A-Za-z]{2,}.*(錠|カプセル|散|顆粒)/.test(head);
}
function clinicName(s) {
  if (/[。、!！?？]|(した|かった|ので|ます|でした|ません|にかか)/.test(s) || s.length > 30) return null;
  if (!CLINIC.test(s) || PHARM.test(s) || /(診療科|科名|紹介|医師|担当)/.test(s) || isDrugLine(s)) return null;
  let t = s.replace(/(処方)?(医療機関名?|病院名|医院名|処方元)\s*[:：]?/g, ' ');
  t = t.replace(/(令和|平成|R|H)?\s*\d{1,4}\s*[年\/.\-]\s*\d{1,2}\s*[月\/.\-]\s*\d{1,2}\s*日?/g, ' ');
  const tk = t.split(/\s+/).filter(Boolean);
  const f = tk.findIndex(x => CLINIC.test(x));
  let l = -1; tk.forEach((x, i) => { if (CLINIC.test(x)) l = i; });
  if (f < 0) return null;
  const name = tk.slice(f, l + 1).join('');
  return name.length >= 2 ? name : null;
}
function cleanName(s) {
  return s.replace(/^\s*(Rp\.?\s*\d+|\d+\s*[).、．:]|[①-⑳]|[・•*])\s*/, '')
          .replace(/【(内服|外用|頓服|内用|屯用)[^】]*】/g, '').trim();
}
function splitDrugLine(line) {
  const fixed = fixUsageOcr(line);
  const st = structUsage(line).startStrict;
  let head = fixed, usage = '';
  if (st >= 0) { head = fixed.slice(0, st); usage = fixed.slice(st).trim(); }
  head = head.trim();
  let dose = '';
  const d = head.match(DOSE_END);
  if (d) { dose = d[0].trim(); head = head.slice(0, d.index).trim(); }
  if (!dose) { const p = usage.match(PER_DOSE); if (p) dose = p[0].trim(); }
  return { name: cleanName(head), dose, usage };
}
function parse(text) {
  const clinics = [];
  let current = -1, waiting = [], lastGroup = [], lastDrug = null, prevUsage = false, prevWasDrug = false;
  const ci = () => {
    if (current < 0) { clinics.push({ id: uid(), name: '医療機関不明', drugs: [] }); current = clinics.length - 1; }
    return current;
  };
  for (const raw of text.split(/\r?\n/)) {
    const line = normalize(raw);
    if (line.length < 2) continue;

    const cn = clinicName(line);
    if (cn) {
      const i = clinics.findIndex(c => c.name === cn);
      if (i >= 0) current = i; else { clinics.push({ id: uid(), name: cn, drugs: [] }); current = clinics.length - 1; }
      waiting = []; lastDrug = null; prevUsage = false; prevWasDrug = false;
      continue;
    }
    if (NOISE.test(line) || PHARM.test(line)) { prevUsage = false; prevWasDrug = false; continue; }

    if (isDrugLine(line)) {
      const p = splitDrugLine(line);
      if (!p.name) continue;
      // 2行目の処方箋記載名（【般】〜など）は直前の薬に紐づける
      const prev = lastDrug && clinics[lastDrug[0]].drugs[lastDrug[1]];
      if (prevWasDrug && prev && !prev.rxName && isRxNameLine(p.name, prev)) {
        prev.rxName = p.name.replace(/^[(（【\[〔]?\s*(処方|Rp|変更前)\s*[:：)）\]】〕]?\s*/, '');
        if (!prev.dose && p.dose) prev.dose = p.dose;
        if (p.usage) { prev.usage = prev.usage ? prev.usage + ' ' + p.usage : p.usage; waiting = []; lastGroup = [lastDrug]; prevUsage = true; prevWasDrug = false; }
        continue;
      }
      const c = ci();
      clinics[c].drugs.push(newDrug(p.name, p.dose, p.usage));
      const ref = [c, clinics[c].drugs.length - 1];
      lastDrug = ref;
      if (p.usage) { waiting = []; lastGroup = [ref]; prevUsage = true; prevWasDrug = false; }
      else { waiting.push(ref); prevUsage = false; prevWasDrug = true; }
      continue;
    }

    const su = structUsage(line);
    if (su.found && (su.times.length || su.perDay || su.days || su.prn.length || su.prnFlag || su.ext.length || su.freq || su.meal)) {
      prevWasDrug = false;
      let targets;
      if (prevUsage) targets = lastGroup;
      else if (waiting.length) targets = waiting;
      else if (lastDrug) targets = [lastDrug];
      else continue;
      const pd = su.text.match(PER_DOSE);
      const utext = su.text.slice(Math.max(0, su.start)).trim();
      for (const [c, d] of targets) {
        const dr = clinics[c].drugs[d];
        dr.usage = dr.usage ? dr.usage + ' ' + utext : utext;
        if (!dr.dose && pd) dr.dose = pd[0].trim();
      }
      lastGroup = targets; waiting = []; prevUsage = true;
      continue;
    }

    if (lastDrug && DOSE_ONLY.test(line)) {
      const dr = clinics[lastDrug[0]].drugs[lastDrug[1]];
      if (!dr.dose) { dr.dose = line; continue; }
    }
    prevUsage = false; prevWasDrug = false;
  }
  return clinics.filter(c => c.drugs.length);
}

/* ================= 用法の構造化 =================
   行のどこにあっても、用法の語彙（あいまい一致）と数字のパターン（正規表現）を拾い、
   { 1日回数, 時点, 食事との関係, 1回量, 日数, 頻度, 頓用条件, 外用の使い方 } に組み立てる。
   回数と時点を突き合わせ、矛盾や読み残しは flags に入れて確認を促す。 */
const T_ORDER = ['起床時', '朝', '昼', '夕', '就寝前'];
const MEAL_RANK = { '食直前': 0, '食前': 1, '食間': 2, '食直後': 3, '食後': 4 };
const USAGE_VOCAB = (() => {
  const v = [];
  const meals = ['食直前', '食直後', '食前', '食後', '食間'];
  for (const m of meals) {
    v.push(['毎' + m, { t: ['朝', '昼', '夕'], m }]);
    v.push(['朝昼夕' + m, { t: ['朝', '昼', '夕'], m }]);
    for (const combo of [['朝', '夕'], ['朝', '昼'], ['昼', '夕']]) v.push([combo.join('') + m, { t: combo, m }]);
    for (const t of ['朝', '昼', '夕']) v.push([t + m, { t: [t], m }]);
  }
  v.push(['起床時', { t: ['起床時'] }], ['就寝前', { t: ['就寝前'] }], ['寝る前', { t: ['就寝前'] }], ['眠前', { t: ['就寝前'] }], ['就寝時', { t: ['就寝前'] }]);
  for (const m of meals) v.push([m, { m }]);
  const prn = ['疼痛時', '痛い時', '痛む時', '発熱時', '熱がある時', '不眠時', '眠れない時', '便秘時', '嘔気時', '吐き気時', '悪心時', '発作時', '頭痛時', '不安時', 'イライラ時', '咳がひどい時', '咳嗽時', 'かゆい時', '掻痒時', '下痢時', '胸痛時', '動悸時', 'めまい時', '必要時', '腹痛時', '息苦しい時'];
  for (const p of prn) v.push([p, { prn: p }]);
  v.push(['頓用', { prnFlag: 1 }], ['頓服', { prnFlag: 1 }]);
  const ext = ['患部に塗布', '患部に貼付', '患部に塗擦', '両眼に点眼', '右眼に点眼', '左眼に点眼', '両耳に点耳', '両鼻に点鼻', '吸入', '肛門内に挿入', '膣内に挿入', '塗布', '貼付', '点眼', '点鼻', '点耳', '噴霧', 'うがい', '含嗽'];
  for (const e of ext) v.push([e, { ext: e }]);
  return v.sort((a, b) => b[0].length - a[0].length);   // 長い語を優先
})();

// 用法まわりでよくあるOCRの誤読を直す
function fixUsageOcr(s) {
  return normalize(s)
    .replace(/(\d)\s*[囗口ロ□]/g, '$1回')
    .replace(/[l|I](?=\s*日|\s*回)/g, '1').replace(/(?<=日|回)\s*[l|I]/g, '1')
    .replace(/曰/g, '日')
    .replace(/食\s*[俊復後彼]/g, '食後').replace(/食\s*[刖削]/g, '食前')
    .replace(/(?<=\d)\s*[O○〇]/g, '0')
    .replace(/寝る\s*目[リ|]/g, '寝る前')
    .replace(/(^|[^\d])[iIl|\]](?=\s*日\s*\d\s*回)/g, '$11')
    .replace(/(^|[^\d])(?=日\s*\d\s*回)/g, '$11')                  // 「1」が落ちた「日3回」
    .replace(/タ(?=\s*食)/g, '夕').replace(/(?<=朝\s*[・,、]?\s*)タ/g, '夕').replace(/(?<=昼\s*[・,、]?\s*)タ/g, '夕')
    .replace(/(朝|昼|夕)\s*[・,、]\s*(?=朝|昼|夕)/g, '$1');
}

function findVocab(s) {
  // 完全一致 → 1文字違いまで（3文字以上の語）の順に、重ならないように拾う
  const hits = [], used = new Uint8Array(s.length);
  const free = (i, L) => { for (let k = i; k < i + L; k++) if (used[k]) return false; return true; };
  const take = (i, L, term, val, dist) => { for (let k = i; k < i + L; k++) used[k] = 1; hits.push({ i, L, term, val, dist }); };
  for (const [term, val] of USAGE_VOCAB) {
    let from = 0, i;
    while ((i = s.indexOf(term, from)) >= 0) { if (free(i, term.length)) take(i, term.length, term, val, 0); from = i + 1; }
  }
  for (const [term, val] of USAGE_VOCAB) {
    if (term.length < 3) continue;
    for (const L of [term.length, term.length - 1, term.length + 1]) {
      for (let i = 0; i + L <= s.length; i++) {
        if (!free(i, L)) continue;
        const w = s.substr(i, L);
        if (/\d/.test(w)) continue;
        if (lev(w, term) <= 1) { take(i, L, term, val, 1); i += L - 1; }
      }
    }
  }
  return hits.sort((a, b) => a.i - b.i);
}

const NUM_PATTERNS = [
  ['perDay', /1\s*日\s*(\d)\s*回/g], ['perDay', /分\s*(\d)(?!\d)/g],
  ['perDose', new RegExp('1\\s*回\\s*(\\d+(?:\\.\\d+)?)\\s*(錠|カプセル|C|包|g|mL|ml|単位|滴|枚|吸入|噴霧|個|本|プッシュ)', 'g')],
  ['days', /(\d+)\s*日\s*分/g], ['times', /(\d+)\s*回\s*分/g],
  ['weekly', /週\s*(\d)\s*(回|日)/g], ['everyN', /(\d+)\s*日\s*(?:ごと|毎|おき)/g], ['alt', /隔日/g],
  ['hourly', /(\d+)\s*時間\s*(?:毎|ごと|おき)/g], ['several', /1\s*日\s*数\s*回/g]
];

function structUsage(text) {
  const s = fixUsageOcr(text || '');
  let spans_site = null;
  const u = { raw: (text || '').trim(), text: s, perDay: 0, times: [], meal: '', perDose: '', days: 0, count: 0, freq: '', prn: [], prnFlag: false, ext: [], unequal: [], flags: [], start: -1, startStrict: -1, found: 0 };
  const site = s.match(/部位[:：]\s*(\S+)/);
  if (site) { u.site = site[1]; spans_site = [site.index, site[0].length]; }
  const mark = (i, strict = true) => {
    if (u.start < 0 || i < u.start) u.start = i;
    if (strict && (u.startStrict < 0 || i < u.startStrict)) u.startStrict = i;
    u.found++;
  };
  const spans = spans_site ? [spans_site] : [];
  for (const [k, re] of NUM_PATTERNS) {
    re.lastIndex = 0;
    let m;
    while ((m = re.exec(s))) {
      mark(m.index); spans.push([m.index, m[0].length]);
      if (k === 'perDay' && !u.perDay) u.perDay = +m[1];
      else if (k === 'perDose' && !u.perDose) u.perDose = m[1] + m[2];
      else if (k === 'days') u.days = +m[1];
      else if (k === 'times') u.count = +m[1];
      else if (k === 'weekly') u.freq = `週${m[1]}回`;
      else if (k === 'everyN') u.freq = `${m[1]}日ごと`;
      else if (k === 'alt') u.freq = '隔日';
      else if (k === 'hourly') u.freq = `${m[1]}時間ごと`;
      else if (k === 'several') u.freq = '1日数回';
    }
  }
  // 時点ごとに量が違う（朝2錠 夕1錠）
  const uneq = /(朝|昼|夕|就寝前|寝る前|眠前)\s*(\d+(?:\.\d+)?)\s*(錠|単位|包|カプセル|C|mL|g)/g;
  let m;
  while ((m = uneq.exec(s))) { u.unequal.push((m[1].match(/寝|眠/) ? '就寝前' : m[1]) + m[2] + m[3]); mark(m.index); spans.push([m.index, m[0].length]); }
  for (const h of findVocab(s)) {
    if (spans.some(([i, L]) => h.i >= i && h.i < i + L)) continue;
    mark(h.i, !h.dist && !(h.val.ext && !/患部|眼|耳|鼻|肛門|膣/.test(h.term)) && !(h.val.m && !h.val.t));
    spans.push([h.i, h.L]);
    if (h.dist) u.flags.push(`「${s.substr(h.i, h.L)}」を「${h.term}」と読みました`);
    const v = h.val;
    if (v.t) for (const t of v.t) if (!u.times.includes(t)) u.times.push(t);
    if (v.m) { if (u.meal && u.meal !== v.m) u.flags.push(`食事との関係が複数（${u.meal}・${v.m}）`); else u.meal = v.m; }
    if (v.prn && !u.prn.includes(v.prn)) u.prn.push(v.prn);
    if (v.prnFlag) u.prnFlag = true;
    if (v.ext && !u.ext.some(e => e.includes(v.ext))) u.ext.push(v.ext);
  }
  for (const x of u.unequal) { const t = x.match(/^(朝|昼|夕|就寝前)/)[1]; if (!u.times.includes(t)) u.times.push(t); }
  u.times.sort((a, b) => T_ORDER.indexOf(a) - T_ORDER.indexOf(b));

  // 読み残し（用法らしい文字が残っていれば確認を促す）
  let rest = s.split('');
  for (const [i, L] of spans) for (let k = i; k < i + L; k++) rest[k] = ' ';
  rest = rest.join('').replace(/服用|使用|して下さい|してください|調剤|[×xX]/g, ' ').replace(/[\s、,。・:：()（）\[\]【】]+/g, ' ').replace(/\b\d+\b/g, '').trim();
  if (u.found && /[一-龥ぁ-んァ-ヴ]/.test(rest.replace(/[ぁ-ん]{1}(?=\s|$)/g, ''))) u.flags.push(`未解釈：${rest.slice(0, 30)}`);

  // 回数と時点の突き合わせ
  const n = u.times.length;
  if (!u.perDay && n && !u.prn.length && !u.prnFlag && !u.freq) u.perDay = n;
  else if (u.perDay && n && u.perDay !== n && !u.freq) u.flags.push(`回数（1日${u.perDay}回）と時点（${n}か所）が合いません`);
  if (u.times.some(t => ['朝', '昼', '夕'].includes(t)) && !u.meal && !u.unequal.length && !u.prn.length) u.flags.push('食前・食後が読み取れません');

  u.kind = (u.prn.length || u.prnFlag) ? 'prn' : u.ext.length ? 'ext' : 'reg';
  u.label = usageLabel(u);
  const firstT = n ? T_ORDER.indexOf(u.times[0]) : 9;
  u.sortKey = [u.kind === 'prn' ? 2 : u.found ? 0 : 1, u.perDay || 9, u.meal in MEAL_RANK ? MEAL_RANK[u.meal] : 5, firstT];
  return u;
}

function timingText(u) {
  const meal = u.times.filter(t => ['朝', '昼', '夕'].includes(t));
  const parts = [];
  if (u.times.includes('起床時')) parts.push('起床時');
  if (meal.length) {
    if (u.meal) parts.push(meal.length === 3 ? '毎' + u.meal : meal.join('') + u.meal);
    else parts.push(meal.join('・'));
  } else if (u.meal && !u.times.length) parts.push(u.meal);
  if (u.times.includes('就寝前')) parts.push('就寝前');
  return parts.join('・');
}

// レポート用の表記：「分2 朝夕食後」「週1回 起床時」「疼痛時 頓用」「分2 患部に塗布」
function usageLabel(u) {
  if (!u.found) return u.raw || '用法未記載';
  if (u.kind === 'prn') return [u.prn.join('・') || '', '頓用', u.perDose ? `1回${u.perDose}` : ''].filter(Boolean).join(' ');
  const tt = timingText(u);
  const head = u.freq ? u.freq : (u.perDay ? `分${u.perDay}` : '');
  let body = u.kind === 'ext' ? [tt, u.ext.join('・')].filter(Boolean).join(' ') + (u.site ? `（${u.site}）` : '') : tt;
  if (!body && u.perDose) body = `1回${u.perDose}`;   // 吸入薬など時点の書かれない用法
  const uneq = u.unequal.length ? `（${u.unequal.join('・')}）` : '';
  return [head, body].filter(Boolean).join(' ') + uneq || u.raw;
}

/* ---- 用法フォーム（構造化した用法）----
   d.u = { perDay, times[], meal, freq, prn, ext, site, perDose, unequal, days }。1日量は d.dose。 */
const MEALS = ['食前', '食直前', '食後', '食直後', '食間'];
function uFromStruct(su) {
  return {
    perDay: su.perDay || 0, times: [...su.times], meal: su.meal || '', freq: su.freq || '',
    prn: su.prn.join('・') || (su.prnFlag ? '頓用' : ''), ext: su.ext.join('・'), site: su.site || '',
    perDose: su.perDose || '', unequal: su.unequal.join('・'),
    days: su.days ? `${su.days}日分` : su.count ? `${su.count}回分` : ''
  };
}
function uFromLLM(x) {
  const S = v => normalize(String(v ?? '')).trim();
  const times = (Array.isArray(x.times) ? x.times : String(x.times || '').split(/[・,、\s]+/)).map(S)
    .map(t => /寝|眠/.test(t) ? '就寝前' : /起床/.test(t) ? '起床時' : t).filter(t => T_ORDER.includes(t));
  times.sort((a, b) => T_ORDER.indexOf(a) - T_ORDER.indexOf(b));
  return {
    perDay: Number.parseInt(S(x.perDay), 10) || 0, times: [...new Set(times)], meal: MEALS.includes(S(x.meal)) ? S(x.meal) : '',
    freq: S(x.frequency), prn: S(x.prn).replace(/頓用|頓服/g, '').replace(/^[・\s]+|[・\s]+$/g, '') || (/頓用|頓服/.test(S(x.prn)) ? '頓用' : ''),
    ext: S(x.ext), site: S(x.site), perDose: S(x.perDose).replace(/^1回/, ''), unequal: S(x.unequal), days: S(x.days)
  };

      if (target.drugs.some(x => key(x.name) === key(d.name))) { skipped++; continue; }
      target.drugs.push({ ...d, name: d.name.trim(), dose: d.dose.trim(), usage: d.usage.trim() });

    }

  save();

}

  for (const c of state.clinics) c.drugs = c.drugs.filter(d => d.id !== id);
  state.clinics = state.clinics.filter(c => c.drugs.length);
  for (const p of state.packs) p.drugIds = p.drugIds.filter(x => x !== id);
  state.packs = state.packs.filter(p => p.drugIds.length);
  ui.recent = ui.recent.filter(x => x !== id);
  ui.undo = ui.undo.filter(u => u.drugId !== id);

}

/* ================= 医薬品マスター（端末内のみ） =================

const FOLD = { 'パ': 'バ', 'ピ': 'ビ', 'プ': 'ブ', 'ペ': 'ベ', 'ポ': 'ボ', '一': 'ー', '－': 'ー', '‐': 'ー', '-': 'ー', '口': 'ロ', '力': 'カ', '工': 'エ', '夕': 'タ', '卜': 'ト' };

    .replace(/\d[\dOoＯ〇]*(?=\s*(?:mg|MG|g|%|μg|mL))/g, m => m.replace(/[OoＯ〇]/g, '0'))
    .replace(/[パピプペポ一－‐\-口力工夕卜]/g, c => FOLD[c] || c)

// 薬名の骨格 p が、OCRの骨格 a の「どこか一部分」とどれだけ一致するか（前後のゴミは無視）
function semiLev(a, p) {

    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (c === a.charCodeAt(j - 1) ? 0 : 1));
    [prev, cur] = [cur, prev];
  }

  for (let j = 0; j <= n; j++) if (prev[j] < best) best = prev[j];

}
function searchSkeleton(sk, strengths, k = 3) {

  for (let i = 0; i < Master.items.length; i++) {
    const p = Master.skel[i];
    if (!p || p.length < 3 || p.length > sk.length + 3) continue;
    const full = 1 - lev(sk, p) / Math.max(sk.length, p.length);
    const part = (1 - semiLev(sk, p) / p.length) * Math.min(1, p.length / 5, p.length / (sk.length * 0.6));

const MK = /[「｢(（]([^」｣)）]+)[」｣)）]?\s*$/;

  Master.skel = Master.items.map(it => kanaSkeleton(it.n));

    const seen = new Set();
    for (let k = 0; k < s.length - 1; k++) {
      const b = s.substr(k, 2);

function lev(a, b) {

  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = new Uint16Array(n + 1), cur = new Uint16Array(n + 1);
  for (let j = 0; j <= n; j++) prev[j] = j;
  for (let i = 1; i <= m; i++) {
    cur[0] = i;
    const ca = a.charCodeAt(i - 1);
    for (let j = 1; j <= n; j++) {
      const c = ca === b.charCodeAt(j - 1) ? 0 : 1;
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + c);

// 音声入力の言い回しを薬品名の表記に寄せる（検索語だけに使う）
function normSpoken(q) {

    .replace(/([一二三四五六七八九])?十([一二三四五六七八九])?/g, (m, a, b) => String((a ? kanjiNum[a] : 1) * 10 + (b ? kanjiNum[b] : 0)))

function searchMaster(q, k = 6, loose = false) {
  const s = loose ? normSpoken(q) : normName(q);

  for (let i = 0; i < s.length - 1; i++) {

}

// 規格の数字（5mg・0.5%・250mg など）が読み取った名前と候補で食い違うときは自動で確定しない

/* ---- 保存（IndexedDB。使えなければこのページを開いている間だけ保持） ---- */
function idb() {
  return new Promise((res, rej) => {
    try {
      const r = indexedDB.open('jishiyaku', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
}
async function idbSet(key, val) {
  try {
    const db = await idb();
    await new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(val, key); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
    return true;
  } catch (e) { return false; }
}
async function idbGet(key) {
  try {
    const db = await idb();
    return await new Promise((res, rej) => { const r = db.transaction('kv').objectStore('kv').get(key); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  } catch (e) { return undefined; }
}

/* ---- 取り込み ---- */
async function readText(file) {
  const buf = await file.arrayBuffer();
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch (e) { return new TextDecoder('shift_jis').decode(buf); }
}
function parseCSV(text, delim) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === delim) { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell.replace(/\r$/, '')); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
async function loadXLSX() {
  if (window.XLSX) return;
  await new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = res;
    s.onerror = () => rej(new Error('Excelを読むための部品を取得できませんでした。通信できる状態で再度お試しください。'));
    document.head.appendChild(s);
  });
}
async function fileTables(file) {
  if (/\.zip$/i.test(file.name)) throw new Error(`${file.name}：ZIPのままでは読めません。「ファイル」アプリでタップして展開してから選んでください。`);
  if (/\.xlsx?$/i.test(file.name)) {
    await loadXLSX();
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    return wb.SheetNames.map(n => XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: false, defval: '' }));
  }
  const text = await readText(file);
  const head = text.slice(0, 4000);
  const delim = (head.split('\t').length > head.split(',').length) ? '\t' : ',';
  return [parseCSV(text, delim)];
}
const isGTIN = v => /^(45|49)\d{11}$/.test(v) || /^\d(45|49)\d{11}$/.test(v);

function detectColumns(rows) {
  // 見出し行があれば見出しで判定
  for (let r = 0; r < Math.min(rows.length, 15); r++) {
    const row = rows[r].map(cellStr);
    const find = (re, not) => row.findIndex(c => c.length < 40 && re.test(c) && !(not && not.test(c)));
    const name = [find(/販売名/, /カナ|コード/), find(/医薬品名|製品名|品名|薬品名|商品名/, /カナ|コード/), find(/告示名称/)].find(i => i >= 0);
    const yj = find(/YJ|個別医薬品コード/);
    const yaka = find(/薬価基準収載医薬品コード|薬価コード|薬価基準コード/);
    const gs1 = row.map((c, i) => (c.length < 40 && /GS1|調剤包装単位コード|販売包装単位コード|元梱包装単位コード|JAN|GTIN/.test(c)) ? i : -1).filter(i => i >= 0);
    const hot = find(/基準番号|HOT/);
    if ((name >= 0 && (yj >= 0 || yaka >= 0 || gs1.length)) || (hot >= 0 && gs1.length)) {
      return { start: r + 1, name: name ?? -1, yj: yj >= 0 ? yj : yaka, gs1, hot };
    }
  }
  // 見出しなし（MEDISのテキスト等）は中身の形で判定
  const sample = rows.slice(0, 400).map(r => r.map(cellStr));
  const width = Math.max(0, ...sample.map(r => r.length));
  const ratio = (i, test) => { let n = 0, t = 0; for (const r of sample) { if (r[i]) { t++; if (test(r[i])) n++; } } return t ? n / sample.length : 0; };
  let yj = -1, name = -1, best = 0, hot = -1; const gs1 = [];
  for (let i = 0; i < width; i++) {
    if (yj < 0 && ratio(i, v => YJ_RE.test(v)) > 0.5) yj = i;
    if (ratio(i, isGTIN) > 0.5) gs1.push(i);
    if (hot < 0 && ratio(i, v => /^\d{13}$/.test(v) && !isGTIN(v)) > 0.5) hot = i;
    const ns = ratio(i, v => /[ァ-ヴ]{2,}/.test(v) && /(錠|カプセル|散|顆粒|液|軟膏|クリーム|テープ|注|mg|%|g)/.test(v));

  return { start: 0, name, yj, gs1, hot };
}

async function importMasterFiles(files, onMsg) {

/* ================= 鑑別レポート ================= */
// 用法を「分N 朝食後」の形に整え、並び順のキーを作る

  const label = n ? `分${n}${timing ? ' ' + timing : ''}` : (timing || '用法未記載');
  const meal = /(食前|食直前)/.test(timing) ? 0 : /食間/.test(timing) ? 1 : /(食後|食直後)/.test(timing) ? 2 : 3;

  for (let i = 0; i < s.length;) {

    while (j + 1 < s.length && s[j + 1] === s[j] + 1) j++;

    for (const d of c.drugs) {

    for (const g of [...groups.values()].sort(cmpKey)) {

/* ================= 持参薬レポートを読む（服用開始・一包化のレシピ用） =================
